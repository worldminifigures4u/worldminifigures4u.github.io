<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Anúncio | Figures Planet</title>
    <link rel="icon" type="image/png" href="figures-planet-logo-transparent.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-wallapop">
    <div class="wallapop-topo">
        <h1>Anúncio</h1>
        <div class="wallapop-topo-acoes">
            <a class="wallapop-botao" href="conta.html">Voltar à conta</a>
            <button class="wallapop-botao wallapop-botao-destaque" type="button" id="btn-descarregar-wallapop">Descarregar PNG</button>
        </div>
    </div>

    <div class="wallapop-bloqueio" id="wallapop-bloqueio">A verificar acesso administrativo...</div>

    <main class="wallapop-layout" id="wallapop-aplicacao" hidden>
        <section class="wallapop-editor" aria-label="Editor do anúncio">
            <h2>Adicionar produtos</h2>
            <div class="wallapop-pesquisa">
                <input type="search" id="wallapop-pesquisa" placeholder="Nome ou SKU" autocomplete="off">
            </div>
            <div class="wallapop-resultados" id="wallapop-resultados"></div>

            <h2>Produtos selecionados</h2>
            <div class="wallapop-selecionados" id="wallapop-selecionados"></div>
            <div class="wallapop-controlos-finais">
                <button class="wallapop-botao" type="button" id="btn-limpar-wallapop">Limpar lista</button>
                <button class="wallapop-botao wallapop-botao-destaque" type="button" id="btn-descarregar-wallapop-secundario">Descarregar PNG</button>
            </div>
            <p class="wallapop-status" id="wallapop-status" aria-live="polite"></p>
        </section>

        <section class="wallapop-preview-wrap" aria-label="Pré-visualização da imagem">
            <div class="wallapop-folha" id="wallapop-folha">
                <div class="wallapop-grelha" id="wallapop-grelha"></div>
            </div>
        </section>
    </main>

    <script src="anuncio.js"></script>
</body>
</html>
