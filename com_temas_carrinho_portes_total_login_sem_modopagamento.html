<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Minifigures 4U</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body{
            margin:0;
            padding:0;
            background:#000;
            color:#fff;
            font-family:Arial, Helvetica, sans-serif;
        }

        header{
            background:#ffc107;
            color:#000;
            text-align:center;
            padding:20px;
        }

        .container{
            display:flex;
            gap:20px;
            padding:20px;
            align-items:flex-start;
        }

        .coluna-esquerda {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 250px;
        }

        .menu-temas, .area-cliente{
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            height:fit-content;
        }

        .menu-temas h2, .area-cliente h2{
            margin-top:0;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        /* Abas de Navegação Cliente (Login / Registo) */
        .abas-cliente {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: #222;
            color: #aaa;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }

        .tab-btn.ativa {
            background: #ffc107;
            color: #000;
        }

        .form-cliente {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-cliente label {
            font-size: 13px;
            color: #aaa;
        }

        .form-cliente input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #222;
            color: white;
            box-sizing: border-box;
        }

        .form-cliente input:focus {
            border-color: #ffc107;
            outline: none;
        }

        .btn-acao-cliente {
            background: #ffc107;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
            color: #000;
        }

        .btn-acao-cliente:hover {
            background: #e0a800;
        }

        .btn-logout {
            background: #ff4d4d;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-top: 10px;
            width: 100%;
        }

        .btn-logout:hover {
            background: #cc3333;
        }

        .msg-status {
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
        }

        .msg-sucesso { color: #28a745; }
        .msg-erro { color: #ff4d4d; }

        .perfil-logado {
            text-align: center;
            padding: 10px 0;
        }

        .perfil-logado p {
            margin: 5px 0;
            font-size: 14px;
        }

        .produtos{
            flex:1;
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
            gap:20px;
        }

        .produto-card{
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            display:flex;
            flex-direction:column;
            transition:0.2s;
        }

        .produto-card:hover{
            border-color:#ffc107;
        }

        .produto-img{
            width:100%;
            height:220px;
            object-fit:contain;
            background:#222;
            border-radius:10px;
        }

        .produto-miniaturas{
            display:flex;
            justify-content:center;
            gap:6px;
            margin-top:10px;
        }

        .miniatura-img{
            width:45px;
            height:45px;
            object-fit:contain;
            border-radius:6px;
            border:1px solid #444;
            cursor:pointer;
        }

        .categoria{
            margin-top:10px;
            color:#ffc107;
            font-size:12px;
            font-weight:bold;
            text-transform:uppercase;
        }

        .subcategoria{
            color:#aaa;
            font-size:12px;
            margin-top:4px;
        }

        .produto-card h3{
            margin-top:12px;
            margin-bottom:0;
        }

        .preco{
            color:#ff4d4d;
            font-size:24px;
            font-weight:bold;
            margin-top:10px;
        }

        .btn-adicionar{
            margin-top:auto;
            background:#ffc107;
            border:none;
            border-radius:8px;
            padding:12px;
            font-weight:bold;
            cursor:pointer;
            transition:0.2s;
        }

        .btn-adicionar:hover{
            background:#e0a800;
        }

        .btn-tema,
        .btn-subtema{
            width:100%;
            border:none;
            border-radius:6px;
            padding:10px;
            margin-bottom:6px;
            text-align:left;
            cursor:pointer;
            font-weight:bold;
        }

        .btn-tema{
            background:#222;
            color:#fff;
        }

        .btn-subtema{
            background:#181818;
            color:#ccc;
        }

        .btn-tema:hover,
        .btn-subtema:hover,
        .btn-tema.ativo,
        .btn-subtema.ativo{
            background:#ffc107;
            color:#000;
        }

        .grupo-subtemas{
            margin-left:10px;
            padding-left:8px;
            border-left:2px solid #333;
            display:none;
        }

        .estado-vitrine{
            background:#111;
            padding:30px;
            border-radius:12px;
            text-align:center;
            grid-column:1 / -1;
        }

        .erro{
            color:#ff4d4d;
        }

        .carrinho{
            width:320px;
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            height:fit-content;
        }

        .carrinho h2{
            margin-top:0;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        .lista-carrinho{
            max-height:300px;
            overflow-y:auto;
        }

        .item-carrinho{
            border-bottom:1px solid #333;
            padding:10px 0;
            display:flex;
            justify-content:space-between;
            gap:10px;
        }

        .item-carrinho strong{
            color:#ffc107;
        }

        .btn-remover{
            background:#ff4d4d;
            border:none;
            color:white;
            padding:6px 10px;
            border-radius:6px;
            cursor:pointer;
            height:fit-content;
        }

        .select-envio{
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid #333;
            background:#222;
            color:white;
            margin-top:10px;
        }

        .total-box{
            margin-top:20px;
            border-top:2px solid #333;
            padding-top:15px;
        }

        .linha-total{
            display:flex;
            justify-content:space-between;
            margin-bottom:10px;
        }

        .valor-final{
            color:#ff4d4d;
            font-size:26px;
            font-weight:bold;
        }

        @media(max-width:1100px){

            .container{
                flex-direction:column;
            }

            .coluna-esquerda,
            .carrinho{
                width:100%;
                box-sizing:border-box;
            }
        }

    </style>
</head>
<body>

<header>
    <h1>🌍 World Minifigures 4U</h1>
    <p>Minifiguras exclusivas de todo o mundo</p>
</header>

<div class="container">

    <div class="coluna-esquerda">
        <aside class="menu-temas" id="menu-lateral-temas">
            <h2>Temas</h2>
            <button class="btn-tema ativo" onclick="filtrarTema('todos', this)">
                ⭐ Todos os Temas
            </button>
        </aside>

        <aside class="area-cliente" id="painel-cliente">
            <div class="abas-cliente" id="abas-autenticacao">
                <button class="tab-btn ativa" onclick="mudarAba('login')">Entrar</button>
                <button class="tab-btn" onclick="mudarAba('registo')">Registar</button>
            </div>

            <form class="form-cliente" id="form-login" onsubmit="fazerLogin(event)">
                <div>
                    <label for="login-email">E-mail da Conta:</label>
                    <input type="email" id="login-email" required placeholder="exemplo@gmail.com">
                </div>
                <button type="submit" class="btn-acao-cliente">Entrar na Conta</button>
            </form>

            <form class="form-cliente" id="form-registo" onsubmit="registarCliente(event)" style="display: none;">
                <div>
                    <label for="registo-nome">Nome Completo:</label>
                    <input type="text" id="registo-nome" required placeholder="Rui Agora vai">
                </div>
                <div>
                    <label for="registo-email">E-mail:</label>
                    <input type="email" id="registo-email" required placeholder="exemplo@gmail.com">
                </div>
                <div>
                    <label for="registo-telemovel">Telemóvel:</label>
                    <input type="tel" id="registo-telemovel" required placeholder="986543467">
                </div>
                <div>
                    <label for="registo-morada">Morada:</label>
                    <input type="text" id="registo-morada" required placeholder="Rua das Bolotas">
                </div>
                <div>
                    <label for="registo-cp">Código Postal (CP):</label>
                    <input type="text" id="registo-cp" required placeholder="1999-001">
                </div>
                <button type="submit" class="btn-acao-cliente">Criar Conta</button>
            </form>

            <div id="status-cliente" class="msg-status"></div>
        </aside>
    </div>

    <main class="produtos" id="vitrine-produtos">
        <div class="estado-vitrine">
            A carregar minifiguras extraordinárias...
        </div>
    </main>

    <aside class="carrinho">
        <h2>🛒 Carrinho</h2>
        <div class="lista-carrinho" id="lista-carrinho">
            <p id="carrinho-vazio">
                Nenhum produto adicionado.
            </p>
        </div>

        <label>📦 Região de envio:</label>
        <select class="select-envio" id="regiao-envio" onchange="recalcularTotais()">
            <option value="portugal">Portugal</option>
            <option value="europa">Europa</option>
            <option value="resto">Resto do Mundo</option>
        </select>

        <div class="total-box">
            <div class="linha-total">
                <span>Subtotal:</span>
                <span id="subtotal">0,00 €</span>
            </div>
            <div class="linha-total">
                <span>Portes:</span>
                <span id="portes">0,00 €</span>
            </div>
            <div class="linha-total valor-final">
                <span>Total:</span>
                <span id="total">0,00 €</span>
            </div>
        </div>
    </aside>

</div>

<script>

const SUPABASE_URL = "https://gksndzxadndrsynvzgzb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdrc25kenhhZG5kcnN5bnZ6Z3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODc5NzMsImV4cCI6MjA5NDY2Mzk3M30.EHZgacYr27dqoc4CJHsOwkNnJFGlLIteSHBi4B1HfVE";

let dbClient = null;
let todosOsProdutos = [];
let carrinho = [];
let clienteLogado = null; // Guarda as informações do cliente quando faz login

window.addEventListener('load', async () => {
    if(typeof supabase !== 'undefined'){
        dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        carregarProdutosDaNuvem();
        verificarSessaoLocal(); // Tenta recuperar sessão anterior se existir
    }
});

// Alternar entre abas Entrar / Registar
function mudarAba(tipo) {
    const btnLogin = document.querySelectorAll('.tab-btn')[0];
    const btnRegisto = document.querySelectorAll('.tab-btn')[1];
    const formLogin = document.getElementById('form-login');
    const formRegisto = document.getElementById('form-registo');
    const statusDiv = document.getElementById('status-cliente');

    statusDiv.innerText = '';

    if (tipo === 'login') {
        btnLogin.classList.add('ativa');
        btnRegisto.classList.remove('ativa');
        formLogin.style.display = 'flex';
        formRegisto.style.display = 'none';
    } else {
        btnLogin.classList.remove('ativa');
        btnRegisto.classList.add('ativa');
        formLogin.style.display = 'none';
        formRegisto.style.display = 'flex';
    }
}

// LOG IN - Procura o utilizador na tabela 'clientes' pelo email
async function fazerLogin(event) {
    event.preventDefault();
    const statusDiv = document.getElementById('status-cliente');
    statusDiv.className = "msg-status";
    statusDiv.innerText = "A verificar...";

    const email = document.getElementById('login-email').value.trim();

    try {
        const { data: clientes, error } = await dbClient
            .from('clientes')
            .select('*')
            .eq('email', email);

        if (error) throw error;

        if (clientes && clientes.length > 0) {
            // Login efetuado com sucesso!
            clienteLogado = clientes[0];
            localStorage.setItem('cliente_email', clienteLogado.email); // Lembrar sessão
            atualizarPainelClienteLogado();
        } else {
            statusDiv.classList.add('msg-erro');
            statusDiv.innerText = "E-mail não encontrado. Registe-se primeiro!";
        }
    } catch (erro) {
        console.error(erro);
        statusDiv.classList.add('msg-erro');
        statusDiv.innerText = "Erro ao fazer login. Tente novamente.";
    }
}

// REGISTO - Grava na tabela 'clientes' do Supabase
async function registarCliente(event) {
    event.preventDefault();
    const statusDiv = document.getElementById('status-cliente');
    statusDiv.className = "msg-status";
    statusDiv.innerText = "A guardar dados...";

    const nome = document.getElementById('registo-nome').value.trim();
    const email = document.getElementById('registo-email').value.trim();
    const telemovel = document.getElementById('registo-telemovel').value.trim();
    const morada = document.getElementById('registo-morada').value.trim();
    const cp = document.getElementById('registo-cp').value.trim();

    try {
        const { data, error } = await dbClient
            .from('clientes')
            .insert([{ email: email, nome: nome, telemovel: telemovel, morada: morada, cp: cp, carrinho: [] }])
            .select();

        if (error) throw error;

        statusDiv.classList.add('msg-sucesso');
        statusDiv.innerText = "⚡ Registado! A iniciar sessão...";
        
        document.getElementById('form-registo').reset();
        
        // Faz login automático após registar
        if (data && data.length > 0) {
            clienteLogado = data[0];
            localStorage.setItem('cliente_email', clienteLogado.email);
            setTimeout(() => { atualizarPainelClienteLogado(); }, 1500);
        }

    } catch (erro) {
        console.error(erro);
        statusDiv.classList.add('msg-erro');
        statusDiv.innerText = "Erro ao registar. E-mail já poderá existir.";
    }
}

// Interface que substitui os forms quando o cliente está ativo
function atualizarPainelClienteLogado() {
    const painel = document.getElementById('painel-cliente');
    painel.innerHTML = `
        <h2>👤 Minha Conta</h2>
        <div class="perfil-logado">
            <p>Bem-vindo(a),</p>
            <strong style="color: #ffc107; font-size: 16px;">${clienteLogado.nome}</strong>
            <p style="color: #888; font-size: 12px; margin-top: 5px;">${clienteLogado.email}</p>
            <p style="color: #aaa; font-size: 12px;">📍 ${clienteLogado.cp}</p>
            <button class="btn-logout" onclick="fazerLogout()">Sair da Conta</button>
        </div>
    `;
}

function fazerLogout() {
    clienteLogado = null;
    localStorage.removeItem('cliente_email');
    // Restaura a estrutura inicial do painel recarregando a secção
    location.reload(); 
}

async function verificarSessaoLocal() {
    const emailGuardado = localStorage.getItem('cliente_email');
    if (emailGuardado) {
        try {
            const { data } = await dbClient.from('clientes').select('*').eq('email', emailGuardado);
            if (data && data.length > 0) {
                clienteLogado = data[0];
                atualizarPainelClienteLogado();
            }
        } catch (e) {
            console.error("Erro ao recuperar sessão:", e);
        }
    }
}

function formatarEuro(valor){
    return Number(valor || 0).toFixed(2).replace('.', ',');
}

function definirEstadoVitrine(mensagem, tipo = ''){
    document.getElementById('vitrine-produtos').innerHTML = `
        <div class="estado-vitrine ${tipo}">
            ${mensagem}
        </div>
    `;
}

function executarComTimeout(promessa, ms, mensagemErro){
    let timeout;
    const timeoutPromise = new Promise((_, reject) => {
        timeout = setTimeout(() => { reject(new Error(mensagemErro)); }, ms);
    });
    return Promise.race([promessa, timeoutPromise]).finally(() => clearTimeout(timeout));
}

async function carregarProdutosDaNuvem(){
    definirEstadoVitrine('A carregar minifiguras extraordinárias...');
    try{
        const query = dbClient.from('produtos').select('*')
            .order('tema', { ascending:true })
            .order('subtema', { ascending:true })
            .order('nome', { ascending:true });

        const { data: listaProdutos, error } = await executarComTimeout(query, 15000, 'Consulta demasiado lenta.');

        if(error){ console.error(error); throw error; }
        if(!listaProdutos || listaProdutos.length === 0){
            definirEstadoVitrine('Nenhum produto encontrado.', 'erro');
            return;
        }

        todosOsProdutos = listaProdutos;
        gerarMenus(listaProdutos);
        gerarProdutos(listaProdutos);
    }catch(erro){
        console.error(erro);
        definirEstadoVitrine('Erro ao carregar produtos do Supabase.', 'erro');
    }
}

function gerarMenus(listaProdutos){
    const menu = document.getElementById('menu-lateral-temas');
    menu.innerHTML = `
        <h2>Temas</h2>
        <button class="btn-tema ativo" onclick="filtrarTema('todos', this)">
            ⭐ Todos os Temas
        </button>
    `;

    const mapa = {};
    listaProdutos.forEach(prod => {
        const tema = (prod.tema || 'Outros').trim();
        const subtema = (prod.subtema && prod.subtema !== 'semsubtema') ? prod.subtema.trim() : '';

        if(!mapa[tema]){ mapa[tema] = []; }
        if(subtema && !mapa[tema].includes(subtema)){ mapa[tema].push(subtema); }
    });

    Object.keys(mapa).forEach(tema => {
        const temaId = tema.toLowerCase().replace(/\s+/g, '-');
        const btnTema = document.createElement('button');
        btnTema.className = 'btn-tema';
        btnTema.innerText = tema;
        btnTema.onclick = function(){ filtrarTema(temaId, this); };
        menu.appendChild(btnTema);

        if(mapa[tema].length > 0){
            const grupo = document.createElement('div');
            grupo.className = 'grupo-subtemas';
            grupo.id = 'grupo-' + temaId;

            mapa[tema].forEach(subtema => {
                const subId = subtema.toLowerCase().replace(/\s+/g, '-');
                const btnSub = document.createElement('button');
                btnSub.className = 'btn-subtema';
                btnSub.innerText = '• ' + subtema;
                btnSub.onclick = function(e){
                    e.stopPropagation();
                    filtrarTema(temaId + '|' + subId, this);
                };
                grupo.appendChild(btnSub);
            });
            menu.appendChild(grupo);
        }
    });
}

function gerarProdutos(listaProdutos){
    const vitrine = document.getElementById('vitrine-produtos');
    vitrine.innerHTML = '';

    listaProdutos.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'produto-card';

        const temaId = (prod.tema || '').toLowerCase().replace(/\s+/g, '-');
        const subtemaId = (prod.subtema || '').toLowerCase().replace(/\s+/g, '-');
        card.dataset.tema = temaId;
        card.dataset.subtema = subtemaId;

        let imagens = [];
        if(Array.isArray(prod.imagens)){ imagens = prod.imagens; }
        else if(prod.imagens){ imagens = [prod.imagens]; }

        if(Array.isArray(prod.miniaturas)){ imagens = [...imagens, ...prod.miniaturas]; }

        const imagemPrincipal = document.createElement('img');
        imagemPrincipal.className = 'produto-img';
        imagemPrincipal.src = imagens.length > 0 ? imagens[0] : 'https://placehold.co/300x300?text=Sem+Imagem';
        card.appendChild(imagemPrincipal);

        if(imagens.length > 1){
            const miniaturasDiv = document.createElement('div');
            miniaturasDiv.className = 'produto-miniaturas';
            imagens.forEach(url => {
                const mini = document.createElement('img');
                mini.className = 'miniatura-img';
                mini.src = url;
                mini.onclick = function(){ imagemPrincipal.src = url; };
                miniaturasDiv.appendChild(mini);
            });
            card.appendChild(miniaturasDiv);
        }

        const category = document.createElement('div');
        category.className = 'categoria';
        category.innerText = prod.tema || 'Outros';
        card.appendChild(category);

        if(prod.subtema && prod.subtema !== 'semsubtema'){
            const subcategoria = document.createElement('div');
            subcategoria.className = 'subcategoria';
            subcategoria.innerText = prod.subtema;
            card.appendChild(subcategoria);
        }

        const titulo = document.createElement('h3');
        titulo.innerText = prod.nome || '';
        card.appendChild(titulo);

        const preco = document.createElement('div');
        preco.className = 'preco';
        preco.innerText = formatarEuro(prod.preco) + ' €';
        card.appendChild(preco);

        const btn = document.createElement('button');
        btn.className = 'btn-adicionar';
        btn.innerText = 'Adicionar ao Carrinho';
        btn.onclick = function(){ adicionarAoCarrinho(prod); };
        card.appendChild(btn);

        vitrine.appendChild(card);
    });
}

function filtrarTema(filtro, botao){
    document.querySelectorAll('.btn-tema, .btn-subtema').forEach(btn => { btn.classList.remove('ativo'); });
    botao.classList.add('ativo');

    const produtos = document.querySelectorAll('.produto-card');

    if(filtro === 'todos'){
        produtos.forEach(prod => { prod.style.display = 'flex'; });
        document.querySelectorAll('.grupo-subtemas').forEach(g => { g.style.display = 'none'; });
        return;
    }

    const partes = filtro.split('|');
    const tema = partes[0];
    const subtema = partes[1] || null;

    produtos.forEach(prod => {
        const temaProd = prod.dataset.tema;
        const subProd = prod.dataset.subtema;
        const mostrar = subtema ? (temaProd === tema && subProd === subtema) : (temaProd === tema);
        prod.style.display = mostrar ? 'flex' : 'none';
    });

    document.querySelectorAll('.grupo-subtemas').forEach(g => {
        if(g.id !== 'grupo-' + tema){ g.style.display = 'none'; }
    });

    const grupoAlvo = document.getElementById('grupo-' + tema);
    if(grupoAlvo && !subtema){ grupoAlvo.style.display = 'block'; }
}

function adicionarAoCarrinho(prod){
    carrinho.push(prod);
    atualizarCarrinho();
}

function atualizarCarrinho(){
    const lista = document.getElementById('lista-carrinho');

    if(carrinho.length === 0){
        lista.innerHTML = `<p id="carrinho-vazio">Nenhum produto adicionado.</p>`;
        recalcularTotais();
        return;
    }

    lista.innerHTML = '';
    carrinho.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item-carrinho';
        div.innerHTML = `
            <div>
                <strong>${item.nome}</strong><br>
                ${formatarEuro(item.preco)} €
            </div>
            <button class="btn-remover" onclick="removerCarrinho(${index})">X</button>
        `;
        lista.appendChild(div);
    });

    recalcularTotais();
}

function removerCarrinho(index){
    carrinho.splice(index, 1);
    atualizarCarrinho();
}

function recalcularTotais(){
    let subtotal = 0;
    carrinho.forEach(item => { subtotal += Number(item.preco || 0); });

    let portes = 0;
    const regiao = document.getElementById('regiao-envio').value;

    if(carrinho.length > 0){
        if(regiao === 'portugal'){ portes = 4.95; }
        if(regiao === 'europa'){ portes = 9.95; }
        if(regiao === 'resto'){ portes = 14.95; }
    }

    const total = subtotal + portes;

    document.getElementById('subtotal').innerText = formatarEuro(subtotal) + ' €';
    document.getElementById('portes').innerText = formatarEuro(portes) + ' €';
    document.getElementById('total').innerText = formatarEuro(total) + ' €';
}

</script>
