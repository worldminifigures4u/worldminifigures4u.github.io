<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Minifigures 4U</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body{
            margin:0;
            padding:0;
            background:#000;
            color:#fff;
            font-family:Arial, Helvetica, sans-serif;
        }

        header{
            background:#ffc107;
            color:#000;
            text-align:center;
            padding:20px;
        }

        .container{
            display:flex;
            gap:20px;
            padding:20px;
            align-items:flex-start;
        }

        .coluna-esquerda {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 250px;
        }

        .menu-temas, .area-cliente{
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            height:fit-content;
            width: 100%;
            box-sizing: border-box;
        }

        .menu-temas h2, .area-cliente h2{
            margin-top:0;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        .abas-cliente {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: #222;
            color: #aaa;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }

        .tab-btn.ativa {
            background: #ffc107;
            color: #000;
        }

        .form-cliente {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-cliente label {
            font-size: 13px;
            color: #aaa;
        }

        .form-cliente input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #222;
            color: white;
            box-sizing: border-box;
        }

        .form-cliente input:focus {
            border-color: #ffc107;
            outline: none;
        }

        .btn-acao-cliente {
            background: #ffc107;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
            color: #000;
            width: 100%;
        }

        .btn-acao-cliente:hover {
            background: #e0a800;
        }

        .btn-logout {
            background: #ff4d4d;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-top: 15px;
            width: 100%;
        }

        .btn-logout:hover {
            background: #cc3333;
        }

        .msg-status {
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            line-height: 1.4;
        }

        .msg-sucesso { color: #28a745; }
        .msg-erro { color: #ff4d4d; }

        .conteudo-central {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .barra-pesquisa-container {
            width: 100%;
            box-sizing: border-box;
        }

        .input-pesquisa {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .input-pesquisa:focus {
            border-color: #ffc107;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.2);
        }

        .produtos{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
            gap:20px;
        }

        .produto-card{
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            display:flex;
            flex-direction:column;
            transition:0.2s;
        }

        .produto-card:hover{
            border-color:#ffc107;
        }

        .produto-img{
            width:100%;
            height:220px;
            object-fit:contain;
            background:#222;
            border-radius:10px;
        }

        .produto-miniaturas{
            display:flex;
            justify-content:center;
            gap:6px;
            margin-top:10px;
            flex-wrap: wrap;
        }

        .miniatura-img{
            width:45px;
            height:45px;
            object-fit:contain;
            border-radius:6px;
            border:1px solid #444;
            cursor:pointer;
            background: #222;
            transition: 0.2s;
        }

        .miniatura-img:hover {
            border-color: #ffc107;
        }

        .categoria{
            margin-top:10px;
            color:#ffc107;
            font-size:12px;
            font-weight:bold;
            text-transform:uppercase;
        }

        .subcategoria{
            color:#aaa;
            font-size:12px;
            margin-top:4px;
        }

        .produto-card h3{
            margin-top:12px;
            margin-bottom:0;
        }

        .preco{
            color:#ff4d4d;
            font-size:24px;
            font-weight:bold;
            margin-top:10px;
        }

        .btn-adicionar{
            margin-top:auto;
            background:#ffc107;
            border:none;
            border-radius:8px;
            padding:12px;
            font-weight:bold;
            cursor:pointer;
            transition:0.2s;
            color: #000;
        }

        .btn-adicionar:hover{
            background:#e0a800;
        }

        .btn-tema, .btn-subtema{
            width:100%;
            border:none;
            border-radius:6px;
            padding:10px;
            margin-bottom:6px;
            text-align:left;
            cursor:pointer;
            font-weight:bold;
        }

        .btn-tema{ background:#222; color:#fff; }
        .btn-subtema{ background:#181818; color:#ccc; }

        .btn-tema:hover, .btn-subtema:hover, .btn-tema.ativo, .btn-subtema.ativo{
            background:#ffc107;
            color:#000;
        }

        .grupo-subtemas{
            margin-left:10px;
            padding-left:8px;
            border-left:2px solid #333;
            display:none;
        }

        .estado-vitrine{
            background:#111;
            padding:30px;
            border-radius:12px;
            text-align:center;
            grid-column:1 / -1;
        }

        .erro{ color:#ff4d4d; }

        .carrinho{
            width:320px;
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            height:fit-content;
        }

        .carrinho h2{
            margin-top:0;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        .lista-carrinho{
            max-height:300px;
            overflow-y:auto;
        }

        .item-carrinho{
            border-bottom:1px solid #333;
            padding:10px 0;
            display:flex;
            justify-content:space-between;
            gap:10px;
        }

        .item-carrinho strong{ color:#ffc107; }

        .btn-remover{
            background:#ff4d4d;
            border:none;
            color:white;
            padding:6px 10px;
            border-radius:6px;
            cursor:pointer;
            height:fit-content;
        }

        .select-envio{
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid #333;
            background:#222;
            color:white;
            margin-top:10px;
        }

        .total-box{
            margin-top:20px;
            border-top:2px solid #333;
            padding-top:15px;
            margin-bottom: 15px;
        }

        .linha-total{
            display:flex;
            justify-content:space-between;
            margin-bottom:10px;
        }

        .valor-final{
            color:#ff4d4d;
            font-size:26px;
            font-weight:bold;
        }

        /* Estilos do Método de Pagamento */
        .seccao-pagamento {
            margin-top: 15px;
            border-top: 1px dashed #333;
            padding-top: 15px;
        }
        .seccao-pagamento h3 {
            font-size: 15px;
            color: #ffc107;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .opcao-pagamento {
            display: flex;
            align-items: center;
            background: #1c1c1c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid #222;
            transition: 0.2s;
        }
        .opcao-pagamento:hover {
            border-color: #444;
        }
        .opcao-pagamento input {
            margin-right: 10px;
            cursor: pointer;
        }

        .btn-confirmar {
            background: #28a745;
            color: white;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 15px;
        }
        .btn-confirmar:hover {
            background: #218838;
        }

        @media(max-width:1100px){
            .container{ flex-direction:column; }
            .coluna-esquerda, .carrinho{ width:100%; box-sizing:border-box; }
        }
    </style>
</head>
<body>

<header>
    <h1>🌍 World Minifigures 4U</h1>

</header>

<div class="container">

    <div class="coluna-esquerda">

    <aside class="carrinho">

</div>

<script>
const SUPABASE_URL = "https://gksndzxadndrsynvzgzb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdrc25kenhhZG5kcnN5bnZ6Z3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODc5NzMsImV4cCI6MjA5NDY2Mzk3M30.EHZgacYr27dqoc4CJHsOwkNnJFGlLIteSHBi4B1HfVE";

let dbClient = null;
let todosOsProdutos = [];
let carrinho = [];
let filtroTemaAtual = 'todos';

window.addEventListener('load', async () => {
    if(typeof supabase !== 'undefined'){
        dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        carregarProdutosDaNuvem();
        verificarSessaoSupabase();
    }
});

function mudarAba(tipo) {
    const btnLogin = document.querySelectorAll('.tab-btn')[0];
    const btnRegisto = document.querySelectorAll('.tab-btn')[1];
    const formLogin = document.getElementById('form-login');
    const formRegisto = document.getElementById('form-registo');
    const statusDiv = document.getElementById('status-cliente');

    statusDiv.innerText = '';

    if (tipo === 'login') {
        btnLogin.classList.add('ativa');
        btnRegisto.classList.remove('ativa');
        formLogin.style.display = 'flex';
        formRegisto.style.display = 'none';
    } else {
        btnLogin.classList.remove('ativa');
        btnRegisto.classList.add('ativa');
        formLogin.style.display = 'none';
        formRegisto.style.display = 'flex';
    }
}

async function fazerLogin(event) {
    event.preventDefault();
    const statusDiv = document.getElementById('status-cliente');
    statusDiv.className = "msg-status";
    statusDiv.innerText = "A entrar...";

    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    try {
        const { data, error } = await dbClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) throw error;

        if (data && data.user) {
            if (data.user.email_confirmed_at === null) {
                await dbClient.auth.signOut();
                statusDiv.className = "msg-status msg-erro";
                statusDiv.innerHTML = "⚠️ <strong>E-mail não confirmado!</strong><br>Por favor, aceda à sua caixa de correio e clique no link de validação enviado para poder iniciar sessão.";
                return;
            }
            obterDadosPerfilDaTabela(data.user.id);
        }
    } catch (erro) {
        console.error(erro);
        statusDiv.className = "msg-status msg-erro";
        statusDiv.innerText = "Erro: " + (erro.message || "E-mail ou password inválidos.");
    }
}

async function registarCliente(event) {
    event.preventDefault();
    const statusDiv = document.getElementById('status-cliente');
    statusDiv.className = "msg-status";
    statusDiv.innerText = "A processar registo de segurança...";

    const nome = document.getElementById('registo-nome').value.trim();
    const email = document.getElementById('registo-email').value.trim();
    const password = document.getElementById('registo-password').value;
    const telemovel = document.getElementById('registo-telemovel').value.trim();
    const morada = document.getElementById('registo-morada').value.trim();
    const cp = document.getElementById('registo-cp').value.trim();

    try {
       const { data, error } = await dbClient.auth.signUp({
    email: email,
    password: password,
    options: {
        emailRedirectTo: 'https://worldminifigures4u.github.io/',
        data: {
            nome: nome,
            telemovel: telemovel,
            morada: morada,
            cp: cp
        }
    }
});

        if (error) throw error;

        if (data && data.user) {
            await dbClient.auth.signOut();

            statusDiv.className = "msg-status msg-sucesso";
            statusDiv.innerHTML = "📧 <strong>Registo efetuado!</strong><br>Enviámos um link de confirmação para o seu e-mail. Ative a conta antes de tentar fazer login.";
            
            document.getElementById('form-registo').reset();
            setTimeout(() => { mudarAba('login'); }, 5000);
        }
    } catch (erro) {
        console.error("Erro completo:", erro);
        statusDiv.className = "msg-status msg-erro";
        statusDiv.innerText = "Erro ao registar: " + (erro.message || "Verifique os dados informados.");
    }
}

async function obterDadosPerfilDaTabela(userId) {
    try {
        const { data, error } = await dbClient
            .from('clientes')
            .select('*')
            .eq('id', userId)
            .single();

        if (error) {
            document.getElementById('conteudo-cliente-anonimo').style.display = 'none';
            document.getElementById('conteudo-cliente-autenticado').style.display = 'block';
            document.getElementById('nome-perfil-logado').innerText = "Cliente Autenticado";
            return;
        }

        if (data) {
            document.getElementById('conteudo-cliente-anonimo').style.display = 'none';
            document.getElementById('conteudo-cliente-autenticado').style.display = 'block';
            document.getElementById('nome-perfil-logado').innerText = data.nome;
            document.getElementById('email-perfil-logado').innerText = data.email;
            document.getElementById('cp-perfil-logado').innerText = "📍 Morada: " + data.morada + " (" + data.cp + ")";
        }
    } catch (e) {
        console.error(e);
    }
}

async function fazerLogout() {
    await dbClient.auth.signOut();
    document.getElementById('conteudo-cliente-autenticado').style.display = 'none';
    document.getElementById('conteudo-cliente-anonimo').style.display = 'block';
    document.getElementById('status-cliente').innerText = '';
    mudarAba('login');
}

async function verificarSessaoSupabase() {
    const { data: { session } } = await dbClient.auth.getSession();
    if (session && session.user) {
        if (session.user.email_confirmed_at === null) {
            await dbClient.auth.signOut();
            return;
        }
        obterDadosPerfilDaTabela(session.user.id);
    }
}

function formatarEuro(valor){ return Number(valor || 0).toFixed(2).replace('.', ','); }

function definirEstadoVitrine(mensagem, tipo = ''){
    document.getElementById('vitrine-produtos').innerHTML = `<div class="estado-vitrine ${tipo}">${mensagem}</div>`;
}

function ejecutarComTimeout(promessa, ms, mensagemErro){
    let timeout;
    const timeoutPromise = new Promise((_, reject) => { timeout = setTimeout(() => { reject(new Error(mensagemErro)); }, ms); });
    return Promise.race([promessa, timeoutPromise]).finally(() => clearTimeout(timeout));
}

async function carregarProdutosDaNuvem(){
    definirEstadoVitrine('A carregar minifiguras extraordinárias...');
    try{
        const query = dbClient.from('produtos').select('*')
            .order('tema', { ascending:true })
            .order('subtema', { ascending:true })
            .order('nome', { ascending:true });

        const { data: listaProdutos, error } = await ejecutarComTimeout(query, 15000, 'Consulta demasiado lenta.');

        if(error){ console.error(error); throw error; }
        if(!listaProdutos || listaProdutos.length === 0){
            definirEstadoVitrine('Nenhum produto encontrado.', 'erro');
            return;
        }

        todosOsProdutos = listaProdutos;
        gerarMenus(listaProdutos);
        gerarProdutos(listaProdutos);
    }catch(erro){
        console.error(erro);
        definirEstadoVitrine('Erro ao carregar produtos do Supabase.', 'erro');
    }
}

function gerarMenus(listaProdutos){
    const menu = document.getElementById('menu-lateral-temas');
    menu.innerHTML = `<h2>Temas</h2><button class="btn-tema ativo" onclick="filtrarTema('todos', this)">⭐ Todos os Temas</button>`;

    const mapa = {};
    listaProdutos.forEach(prod => {
        const tema = (prod.tema || 'Outros').trim();
        const subtema = (prod.subtema && prod.subtema !== 'semsubtema') ? prod.subtema.trim() : '';
        if(!mapa[tema]){ mapa[tema] = []; }
        if(subtema && !mapa[tema].includes(subtema)){ mapa[tema].push(subtema); }
    });

    Object.keys(mapa).forEach(tema => {
        const temaId = tema.toLowerCase().replace(/\s+/g, '-');
        const btnTema = document.createElement('button');
        btnTema.className = 'btn-tema';
        btnTema.innerText = tema;
        btnTema.onclick = function(){ filtrarTema(temaId, this); };
        menu.appendChild(btnTema);

        if(mapa[tema].length > 0){
            const group = document.createElement('div');
            group.className = 'grupo-subtemas';
            group.id = 'grupo-' + temaId;

            mapa[tema].forEach(subtema => {
                const subId = subtema.toLowerCase().replace(/\s+/g, '-');
                const btnSub = document.createElement('button');
                btnSub.className = 'btn-subtema';
                btnSub.innerText = '• ' + subtema;
                btnSub.onclick = function(e){
                    e.stopPropagation();
                    filtrarTema(temaId + '|' + subId, this);
                };
                group.appendChild(btnSub);
            });
            menu.appendChild(group);
        }
    });
}

function gerarProdutos(listaProdutos){
    const vitrine = document.getElementById('vitrine-produtos');
    vitrine.innerHTML = '';

    listaProdutos.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'produto-card';
        card.dataset.id = prod.id;
        
        const nomeLimpo = (prod.nome || '').trim().toLowerCase();
        card.dataset.nome = nomeLimpo; 
        
        card.dataset.tema = (prod.tema || '').toLowerCase().replace(/\s+/g, '-');
        card.dataset.subtema = (prod.subtema || '').toLowerCase().replace(/\s+/g, '-');

        let listaImagens = [];
        
        if (prod.imagens) {
            if (Array.isArray(prod.imagens)) {
                listaImagens = prod.imagens;
            } else if (typeof prod.imagens === 'string') {
                const textoLimpo = prod.imagens.trim();
                if (textoLimpo.startsWith('[') && textoLimpo.endsWith(']')) {
                    try {
                        listaImagens = JSON.parse(textoLimpo);
                    } catch(e) {
                        listaImagens = textoLimpo.replace(/[\[\]"]/g, '').split(',').map(s => s.trim());
                    }
                } else {
                    listaImagens = [textoLimpo];
                }
            }
        }

        listaImagens = listaImagens.filter(url => url && typeof url === 'string' && url.trim() !== "");

        const imagemPrincipal = document.createElement('img');
        imagemPrincipal.className = 'produto-img';
        imagemPrincipal.src = listaImagens.length > 0 ? listaImagens[0] : 'https://placehold.co/300x300?text=Sem+Imagem';
        card.appendChild(imagemPrincipal);

        if (listaImagens.length > 1) {
            const miniaturasDiv = document.createElement('div');
            miniaturasDiv.className = 'produto-miniaturas';
            
            listaImagens.forEach(url => {
                const mini = document.createElement('img');
                mini.className = 'miniatura-img';
                mini.src = url;
                mini.onclick = function() { imagemPrincipal.src = url; };
                miniaturasDiv.appendChild(mini);
            });
            card.appendChild(miniaturasDiv);
        }

        const category = document.createElement('div');
        category.className = 'categoria';
        category.innerText = prod.tema || 'Outros';
        card.appendChild(category);

        if(prod.subtema && prod.subtema !== 'semsubtema'){
            const subcategoria = document.createElement('div');
            subcategoria.className = 'subcategoria';
            subcategoria.innerText = prod.subtema;
            card.appendChild(subcategoria);
        }

        const titulo = document.createElement('h3');
        titulo.innerText = prod.nome || '';
        card.appendChild(titulo);

        const preco = document.createElement('div');
        preco.className = 'preco';
        preco.innerText = formatarEuro(prod.preco) + ' €';
        card.appendChild(preco);

        const btn = document.createElement('button');
        btn.className = 'btn-adicionar';
        btn.innerText = 'Adicionar ao Carrinho';
        btn.onclick = function(){ adicionarAoCarrinho(prod); };
        card.appendChild(btn);

        vitrine.appendChild(card);
    });
}

function filtrarTema(filtro, botao){
    document.querySelectorAll('.btn-tema, .btn-subtema').forEach(btn => { btn.classList.remove('ativo'); });
    botao.classList.add('ativo');

    filtroTemaAtual = filtro;

    if(filtro === 'todos'){
        document.querySelectorAll('.grupo-subtemas').forEach(g => { g.style.display = 'none'; });
    } else {
        const partes = filtro.split('|');
        const tema = partes[0];
        document.querySelectorAll('.grupo-subtemas').forEach(g => { if(g.id !== 'grupo-' + tema){ g.style.display = 'none'; } });
        const grupoAlvo = document.getElementById('grupo-' + tema);
        if(grupoAlvo && partes.length === 1){ grupoAlvo.style.display = 'block'; }
    }

    executarFiltrosCombinados();
}

function verificarTeclaEnter(evento) {
    if (evento.key === "Enter") {
        evento.preventDefault(); 
        executarFiltrosCombinados();
    }
}

function ejecutarFiltrosCombinados() {
    const inputRaw = document.getElementById('campo-pesquisa').value || '';
    const textoPesquisa = inputRaw.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    
    const todosOsCards = document.querySelectorAll('.produto-card');
    let totalVisiveis = 0;

    const partesTema = filtroTemaAtual.split('|');
    const temaAtivo = partesTema[0];
    const subtemaAtivo = partesTema[1] || null;

    todosOsCards.forEach(card => {
        let correspondeAoTema = false;
        if (filtroTemaAtual === 'todos') {
            correspondeAoTema = true;
        } else {
            const cardTema = card.dataset.tema || '';
            const cardSubtema = card.dataset.subtema || '';
            correspondeAoTema = subtemaAtivo 
                ? (cardTema === temaAtivo && cardSubtema === subtemaAtivo) 
                : (cardTema === temaAtivo);
        }

        const nomeCardBruto = card.dataset.nome || '';
        const nomeCardNormalizado = nomeCardBruto.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const correspondeAoNome = nomeCardNormalizado.includes(textoPesquisa);

        if (correspondeAoTema && correspondeAoNome) {
            card.style.display = 'flex';
            totalVisiveis++;
        } else {
            card.style.display = 'none';
        }
    });

    const avisoExistente = document.getElementById('aviso-pesquisa-vazia');
    if (avisoExistente) avisoExistente.remove();

    if (totalVisiveis === 0 && todosOsCards.length > 0) {
        const vitrine = document.getElementById('vitrine-produtos');
        const erroDiv = document.createElement('div');
        erroDiv.id = 'aviso-pesquisa-vazia';
        erroDiv.className = 'estado-vitrine erro';
        erroDiv.innerText = '🔍 Nenhuma minifigura encontrada com esse nome.';
        vitrine.appendChild(erroDiv);
    }
}

function adicionarAoCarrinho(prod){ carrinho.push(prod); atualizarCarrinho(); }

function atualizarCarrinho(){
    const lista = document.getElementById('lista-carrinho');
    if(carrinho.length === 0){
        lista.innerHTML = `<p id="carrinho-vazio">Nenhum produto adicionado.</p>`;
        recalcularTotais();
        return;
    }

    lista.innerHTML = '';
    carrinho.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item-carrinho';
        div.innerHTML = `<div><strong>${item.nome}</strong><br>${formatarEuro(item.preco)} €</div><button class="btn-remover" onclick="removerCarrinho(${index})">X</button>`;
        lista.appendChild(div);
    });
    recalcularTotais();
}

function removerCarrinho(index){ carrinho.splice(index, 1); atualizarCarrinho(); }

function recalcularTotais(){
    let subtotal = 0;
    carrinho.forEach(item => { subtotal += Number(item.preco || 0); });

    let portes = 0;
    const regiao = document.getElementById('regiao-envio').value;
    if(carrinho.length > 0){
        if(regiao === 'portugal'){ portes = 4.95; }
        if(regiao === 'europa'){ portes = 9.95; }
        if(regiao === 'resto'){ portes = 14.95; }
    }

    document.getElementById('subtotal').innerText = formatarEuro(subtotal) + ' €';
    document.getElementById('portes').innerText = formatarEuro(portes) + ' €';
    document.getElementById('total').innerText = formatarEuro(subtotal + portes) + ' €';
}

// FUNÇÃO ATUALIZADA PARA INSERIR ENCOMENDAS REAIS DE FORMA DINÂMICA E SEGURA
async function criarNovaEncomenda() {
  const statusDiv = document.getElementById('status-encomenda');
  statusDiv.className = "msg-status";
  statusDiv.innerText = "A processar encomenda...";

  // 1. Validar se o carrinho está vazio
  if (carrinho.length === 0) {
    statusDiv.className = "msg-status msg-erro";
    statusDiv.innerText = "❌ O seu carrinho está vazio.";
    alert("Adicione pelo menos um produto ao carrinho antes de finalizar.");
    return;
  }

  // 2. Buscar o utilizador atual logado no sistema do Supabase
  const { data: { user }, error: authError } = await dbClient.auth.getUser();

  // Se o utilizador não estiver logado, as RLS Policies do Supabase vão bloquear de qualquer forma.
  if (authError || !user) {
    console.error("Erro de Autenticação:", authError);
    statusDiv.className = "msg-status msg-erro";
    statusDiv.innerText = "⚠️ Necessita de iniciar sessão.";
    alert("Por favor, faça login ou registe-se na coluna lateral esquerda para poder finalizar a sua encomenda.");
    return;
  }

  // 3. Obter dinamicamente o total calculado do ecrã
  const textoTotal = document.getElementById('total').innerText; // Ex: "14,93 €"
  const totalNumerico = parseFloat(textoTotal.replace('€', '').replace(',', '.').trim());

  // 4. Obter o método de pagamento selecionado pelos inputs de rádio
  const radioSelecionado = document.querySelector('input[name="metodo-pagamento"]:checked');
  const metodoPagamento = radioSelecionado ? radioSelecionado.value : "Não especificado";

  // 5. Mapear os produtos do array global 'carrinho' para o formato estruturado JSON que vai na coluna 'produtos'
  const listaProdutosJSON = carrinho.map(item => ({
    id_produto: item.id,
    nome: item.nome,
    preco_unitario: item.preco
  }));

  // 6. Preparar o objeto final com correspondência exata às colunas da base de dados
  const dadosDaEncomenda = {
    id_cliente: user.id,          // Passa na policy porque coincide exatamente com o token JWT
    produtos: listaProdutosJSON,   // Guardado como array de objetos dentro do campo jsonb
    total: totalNumerico,          // Tipo numeric
    metodo_pagamento: metodoPagamento, // Tipo text
    estado: "Pendente"            // Estado inicial padrão da encomenda
  };

  try {
    // 7. Enviar dados para o Supabase de forma protegida
    const { data, error } = await dbClient
      .from('encomendas')
      .insert([dadosDaEncomenda])
      .select();

    if (error) throw error;

    // 8. Sucesso: Limpar carrinho e dar feedback ao utilizador
    console.log("Encomenda gravada com sucesso:", data);
    statusDiv.className = "msg-status msg-sucesso";
    statusDiv.innerHTML = "🎉 <strong>Encomenda registada com sucesso!</strong><br>Aguarde o processamento do seu pagamento.";
    
    // Limpar o estado do carrinho local do utilizador após o sucesso
    carrinho = [];
    atualizarCarrinho();
    alert("Sucesso! A sua encomenda foi submetida.");

  } catch (err) {
    console.error("Erro ao gravar encomenda:", err.message);
    statusDiv.className = "msg-status msg-erro";
    statusDiv.innerText = "Erro ao guardar: " + err.message;
    alert("Houve um problema ao processar a compra. Verifique a consola do programador.");
  }
}
