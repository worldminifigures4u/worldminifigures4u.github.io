<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Minifigures 4U</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body{
            margin:0;
            padding:0;
            background:#000;
            color:#fff;
            font-family:Arial, Helvetica, sans-serif;
        }

        header{
            background:#ffc107;
            color:#000;
            text-align:center;
            padding:20px;
        }

        .container{
            display:flex;
            gap:20px;
            padding:20px;
            align-items:flex-start;
        }

        .coluna-esquerda {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 250px;
        }

        .menu-temas, .area-cliente{
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            height:fit-content;
            width: 100%;
            box-sizing: border-box;
        }

        .menu-temas h2, .area-cliente h2{
            margin-top:0;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        .abas-cliente {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: #222;
            color: #aaa;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }

        .tab-btn.ativa {
            background: #ffc107;
            color: #000;
        }

        .form-cliente {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-cliente label {
            font-size: 13px;
            color: #aaa;
        }

        .form-cliente input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #222;
            color: white;
            box-sizing: border-box;
        }

        .form-cliente input:focus {
            border-color: #ffc107;
            outline: none;
        }

        .btn-acao-cliente {
            background: #ffc107;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
            color: #000;
            width: 100%;
        }

        .btn-acao-cliente:hover {
            background: #e0a800;
        }

        .btn-logout {
            background: #ff4d4d;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-top: 15px;
            width: 100%;
        }

        .btn-logout:hover {
            background: #cc3333;
        }

        .msg-status {
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            line-height: 1.4;
        }

        .msg-sucesso { color: #28a745; }
        .msg-erro { color: #ff4d4d; }

        .conteudo-central {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .barra-pesquisa-container {
            width: 100%;
            box-sizing: border-box;
        }

        .input-pesquisa {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .input-pesquisa:focus {
            border-color: #ffc107;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.2);
        }

        .produtos{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
            gap:20px;
        }

        .produto-card{
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            display:flex;
            flex-direction:column;
            transition:0.2s;
        }

        .produto-card:hover{
            border-color:#ffc107;
        }

        .produto-img{
            width:100%;
            height:220px;
            object-fit:contain;
            background:#222;
            border-radius:10px;
        }

        .produto-miniaturas{
            display:flex;
            justify-content:center;
            gap:6px;
            margin-top:10px;
            flex-wrap: wrap;
        }

        .miniatura-img{
            width:45px;
            height:45px;
            object-fit:contain;
            border-radius:6px;
            border:1px solid #444;
            cursor:pointer;
            background: #222;
            transition: 0.2s;
        }

        .miniatura-img:hover {
            border-color: #ffc107;
        }

        .categoria{
            margin-top:10px;
            color:#ffc107;
            font-size:12px;
            font-weight:bold;
            text-transform:uppercase;
        }

        .subcategoria{
            color:#aaa;
            font-size:12px;
            margin-top:4px;
        }

        .produto-card h3{
            margin-top:12px;
            margin-bottom:0;
        }

        .preco{
            color:#ff4d4d;
            font-size:24px;
            font-weight:bold;
            margin-top:10px;
        }

        .btn-adicionar{
            margin-top:auto;
            background:#ffc107;
            border:none;
            border-radius:8px;
            padding:12px;
            font-weight:bold;
            cursor:pointer;
            transition:0.2s;
            color: #000;
        }

        .btn-adicionar:hover{
            background:#e0a800;
        }

        .btn-tema, .btn-subtema{
            width:100%;
            border:none;
            border-radius:6px;
            padding:10px;
            margin-bottom:6px;
            text-align:left;
            cursor:pointer;
            font-weight:bold;
        }

        .btn-tema{ background:#222; color:#fff; }
        .btn-subtema{ background:#181818; color:#ccc; }

        .btn-tema:hover, .btn-subtema:hover, .btn-tema.ativo, .btn-subtema.ativo{
            background:#ffc107;
            color:#000;
        }

        .grupo-subtemas{
            margin-left:10px;
            padding-left:8px;
            border-left:2px solid #333;
            display:none;
        }

        .estado-vitrine{
            background:#111;
            padding:30px;
            border-radius:12px;
            text-align:center;
            grid-column:1 / -1;
        }

        .erro{ color:#ff4d4d; }

        .carrinho{
            width:320px;
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            height:fit-content;
        }

        .carrinho h2{
            margin-top:0;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        .lista-carrinho{
            max-height:300px;
            overflow-y:auto;
        }

        .item-carrinho{
            border-bottom:1px solid #333;
            padding:10px 0;
            display:flex;
            justify-content:space-between;
            gap:10px;
        }

        .item-carrinho strong{ color:#ffc107; }

        .btn-remover{
            background:#ff4d4d;
            border:none;
            color:white;
            padding:6px 10px;
            border-radius:6px;
            cursor:pointer;
            height:fit-content;
        }

        .select-envio{
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid #333;
            background:#222;
            color:white;
            margin-top:10px;
        }

        .total-box{
            margin-top:20px;
            border-top:2px solid #333;
            padding-top:15px;
            margin-bottom: 15px;
        }

        .linha-total{
            display:flex;
            justify-content:space-between;
            margin-bottom:10px;
        }

        .valor-final{
            color:#ff4d4d;
            font-size:26px;
            font-weight:bold;
        }

        /* Estilos do Checkout e Métodos de Pagamento */
        .seccao-pagamento {
            margin-top: 20px;
            border-top: 1px dashed #333;
            padding-top: 15px;
        }

        .seccao-pagamento h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #ffc107;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .opcao-pagamento {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #181818;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #222;
            cursor: pointer;
            transition: 0.2s;
        }

        .opcao-pagamento:hover {
            border-color: #ffc107;
        }

        .opcao-pagamento input {
            cursor: pointer;
            accent-color: #ffc107;
        }

        .btn-encomenda {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-encomenda:hover {
            background: #218838;
        }

        @media(max-width:1100px){
            .container{ flex-direction:column; }
            .coluna-esquerda, .carrinho{ width:100%; box-sizing:border-box; }
        }
    </style>
</head
