<html lang="pt">
<head>
    <meta charset="UTF-8">

    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Fornecedores | Figures Planet</title>
    <link rel="icon" type="image/jpeg" href="assets/logo-figures-planet.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
    <link rel="stylesheet" href="styles.css?v=20260702-admin-compacto">
    <link rel="stylesheet" href="admin-imagem.css?v=20260628-css-split-admin-imagem">
    <link rel="stylesheet" href="fornecedores-mapas.css?v=20260627-css-split-fornecedores-mapas">
</head>
<body class="pagina-fornecedores-admin pagina-fornecedores-unificada cabecalho-com-admin pagina-com-cabecalho-site">
    <header class="cabecalho-site-admin">
        <div class="cabecalho-loja">
            <a class="logo-loja" href="index.html" aria-label="Figures Planet - Produtos">
                <img src="figures-planet-logo-transparent.png" alt="Figures Planet">
            </a>
            <form class="cabecalho-pesquisa" action="index.html" method="get">
                <input type="search" name="q" class="input-pesquisa" placeholder="O que estás à procura?">
                <span class="icone-pesquisa" aria-hidden="true"></span>
            </form>
            <div class="acoes-cabecalho acoes-cabecalho-publicas">
                <a class="acao-cabecalho" href="conta.html" aria-label="Abrir area de cliente" data-vista-nav="conta">
                    <span class="icone-acao" aria-hidden="true"></span>
                    <span class="texto-acao">
                        <strong>Conta</strong>
                        <span class="detalhe-conta-cabecalho" id="nome-login-cabecalho"></span>
                    </span>
                </a>
                <a class="acao-cabecalho acao-favoritos-topo" href="favoritos.html" aria-label="Abrir favoritos" title="Favoritos" data-vista-nav="favoritos">
                    <svg class="icone-coracao-favorito" viewBox="0 0 100 92" aria-hidden="true" focusable="false">
                        <path d="M50 84 L14 48 C3 37 3 18 15 9 C27 0 44 4 50 20 C56 4 73 0 85 9 C97 18 97 37 86 48 Z" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </a>
                <a class="acao-cabecalho acao-carrinho" href="carrinho.html" aria-label="Abrir carrinho" data-vista-nav="carrinho">
                    <span class="icone-acao" aria-hidden="true"></span>
                    <span class="badge-carrinho" id="contador-carrinho-cabecalho">0</span>
                </a>
            </div>
            <nav class="navegacao-publica-cabecalho" aria-label="Navegacao principal">
                <a class="acao-cabecalho acao-produtos" href="index.html" data-vista-nav="loja">
                    <span class="texto-acao"><strong>Produtos</strong></span>
                </a>
                <a class="acao-cabecalho" href="sobre.html" data-vista-nav="sobre">
                    <span class="texto-acao"><strong>Sobre n&oacute;s</strong></span>
                </a>
                <a class="acao-cabecalho" href="contactos.html" data-vista-nav="contactos">
                    <span class="texto-acao"><strong>Contactos</strong></span>
                </a>
                <a class="acao-cabecalho" href="politicas.html" data-vista-nav="politicas">
                    <span class="texto-acao"><strong>Pol&iacute;ticas</strong></span>
                </a>
            </nav>
            <nav class="navegacao-admin-cabecalho" aria-label="Navegação administrativa" hidden>
            <a class="acao-cabecalho acao-gestao-admin" href="gestao.html" aria-label="Abrir gestão administrativa">
                <span class="texto-acao"><strong>Gestão</strong></span>
            </a>
            <a class="acao-cabecalho acao-plataforma-admin" href="plataforma.html" aria-label="Gerir plataformas"><span class="texto-acao"><strong>Plataformas</strong></span></a>
            <a class="acao-cabecalho" href="mapas.html">Mapas</a>
            <a class="acao-cabecalho ativa" href="fornecedores.html">Fornecedores</a>
            <a class="acao-cabecalho" href="encomendas.html">Encomendas</a>
            <a class="acao-cabecalho" href="estatisticas.html">Estatísticas</a>
            <a class="acao-cabecalho" href="clientes.html">Clientes</a>
            </nav>
        </div>
    </header>

    <div class="wallapop-bloqueio" id="fornecedores-bloqueio">A verificar acesso administrativo...</div>

    <main class="fornecedores-admin" id="fornecedores-aplicacao" hidden>
        <section class="fornecedores-grid fornecedores-grid-unificada">
            <section class="fornecedores-painel fornecedores-painel-mapa" id="fornecedores-escolher" aria-label="Produtos para fornecedor">
                <div class="fornecedor-lista-controles mapas-lista-controles">
                    <label for="fornecedor-nome">
                        Fornecedor
                        <select id="fornecedor-nome"></select>
                    </label>
                    <label for="fornecedor-filtro-marcacao">
                        Filtro do fornecedor
                        <select id="fornecedor-filtro-marcacao">
                            <option value="todos">Todos</option>
                            <option value="os">OS</option>
                            <option value="ex">EX</option>
                            <option value="disponivel">Disponivel</option>
                        </select>
                    </label>
                    <label for="fornecedor-filtro-top">
                        Filtro Top
                        <select id="fornecedor-filtro-top">
                            <option value="todos">Todos</option>
                            <option value="top">Apenas Top</option>
                            <option value="sem-top">Sem Top</option>
                        </select>
                    </label>
                    <label for="fornecedor-filtro-descontinuado">
                        Descontinuado
                        <select id="fornecedor-filtro-descontinuado">
                            <option value="todos">Todos</option>
                            <option value="descontinuado">Apenas descontinuadas</option>
                            <option value="sem-descontinuado">Sem descontinuadas</option>
                        </select>
                    </label>
                </div>
                <div id="fornecedor-contador-barra" class="mapas-contador-filtros">
                    <input id="fornecedor-pesquisa" class="fornecedor-pesquisa-compacta" type="search" placeholder="Nome, Ref., SKU ou tema">
                </div>
                <div id="fornecedor-resultados" class="fornecedor-resultados"></div>

                <h3>Produtos selecionados</h3>
                <div id="fornecedor-selecionados" class="fornecedor-selecionados"></div>
                <label class="fornecedor-referencia-final" for="fornecedor-referencia">
                    Número / referência da encomenda ao fornecedor
                    <input id="fornecedor-referencia" type="text" placeholder="Ex.: FV4WG8">
                </label>
                <div class="fornecedores-acoes">
                    <button type="button" id="btn-limpar-fornecedor">Limpar lista</button>
                    <button type="button" id="btn-criar-fornecedor">Criar encomenda</button>
                </div>
            </section>

            <section class="fornecedores-painel fornecedores-painel-ficha" aria-label="Ficha do fornecedor">
                <details class="fornecedor-ficha-box">
                    <summary>Ficha do fornecedor</summary>
                    <form class="fornecedor-ficha-form" id="fornecedor-ficha-form">
                        <input type="hidden" id="fornecedor-ficha-id">
                        <label for="fornecedor-ficha-lista">
                            Fornecedor guardado
                            <select id="fornecedor-ficha-lista"></select>
                        </label>
                        <label for="fornecedor-ficha-nome">
                            Nome
                            <input id="fornecedor-ficha-nome" type="text" required placeholder="Ex.: Lote 50">
                        </label>
                        <label for="fornecedor-ficha-contacto">
                            Contacto / link
                            <input id="fornecedor-ficha-contacto" type="text" placeholder="Email, WhatsApp, AliExpress, site...">
                        </label>
                        <label for="fornecedor-ficha-notas" class="fornecedor-ficha-largo">
                            Notas
                            <textarea id="fornecedor-ficha-notas" rows="3" placeholder="Notas internas, prazos, moedas, regras, observacoes..."></textarea>
                        </label>
                        <label class="fornecedor-ficha-ativo">
                            <input id="fornecedor-ficha-ativo" type="checkbox" checked>
                            Ativo
                        </label>
                        <div class="fornecedores-acoes fornecedor-ficha-acoes">
                            <button type="button" id="fornecedor-ficha-apagar" class="fornecedor-ficha-apagar">Apagar fornecedor</button>
                            <button type="button" id="fornecedor-ficha-novo">Novo</button>
                            <button type="submit">Guardar fornecedor</button>
                        </div>
                    </form>
                </details>
            </section>

            <section class="fornecedores-painel fornecedores-painel-lista" aria-label="Encomendas a fornecedores">
                <div class="fornecedores-cabecalho-lista">
                    <h2 id="fornecedores-encomendas">Encomendas a fornecedores</h2>
                </div>
                <div class="fornecedores-form-grid fornecedores-filtros">
                    <label for="fornecedor-filtro-estado">Estado</label>
                    <select id="fornecedor-filtro-estado">
                        <option value="todos">Todos</option>
                        <option value="a_preparar">A preparar</option>
                        <option value="encomendada">Encomendada</option>
                        <option value="recebida_parcialmente">Recebida parcialmente</option>
                        <option value="recebida">Recebida</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>
                <div id="fornecedor-pedidos" class="fornecedor-pedidos"></div>
            </section>
        </section>
        <p class="fornecedores-status" id="fornecedores-status" role="status"></p>
    </main>

    <div id="admin-imagem-modal" class="admin-imagem-modal" hidden>
        <button type="button" id="admin-imagem-modal-fechar" class="admin-imagem-modal-fechar" aria-label="Fechar imagem">x</button>
        <img id="admin-imagem-modal-foto" src="" alt="">
    </div>
    <script src="fornecedores.js?v=20260629-dynamic-style-classes"></script>
<script src="inline-listeners.js?v=20260629-csp-inline"></script>
</body>
</html>
