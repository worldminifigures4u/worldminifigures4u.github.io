                <img src="figures-planet-logo-transparent.webp?v=20260725-logo-hq" alt="Figures Planet" width="383" height="69" decoding="async" fetchpriority="high">

                <input type="search" name="q" class="input-pesquisa" placeholder="O que estás à procura?">
                <span class="icone-pesquisa" aria-hidden="true"></span>
            </form>
            <div class="acoes-cabecalho acoes-cabecalho-publicas">
                <a class="acao-cabecalho" href="conta.html" aria-label="Abrir area de cliente" data-vista-nav="conta">

            </div>
            <nav class="navegacao-admin-cabecalho" aria-label="Navegação administrativa" hidden>

    <div class="wallapop-bloqueio" id="fornecedores-bloqueio">A verificar acesso administrativo...</div>

    <main class="fornecedores-admin" id="fornecedores-aplicacao" hidden>
        <section class="fornecedores-grid fornecedores-grid-unificada">
            <section class="fornecedores-painel fornecedores-painel-mapa" id="fornecedores-escolher" aria-label="Produtos para fornecedor">
                <div class="fornecedor-lista-controles mapas-lista-controles fornecedor-controles-unificados">
                    <label class="fornecedor-seletor-label" for="fornecedor-nome">
                        Encomendar a
                        <span class="fornecedor-seletor-linha">
                            <select id="fornecedor-nome"></select>
                            <button type="button" id="btn-editar-fornecedor-selecionado" class="fornecedor-btn-editar-ficha">Editar</button>
                        </span>
                    </label>
                    <label class="fornecedor-controle-filtro-compacto" for="fornecedor-filtro-marcacao-fornecedor" title="Fornecedor onde verificar a marcação OS/EX" hidden>
                        Ver marcação em
                        <select id="fornecedor-filtro-marcacao-fornecedor">
                            <option value="mesmo">Fornecedor selecionado</option>
                        </select>
                    </label>
                    <label class="fornecedor-controle-filtro-compacto" for="fornecedor-filtro-marcacao" title="Disponivel inclui vazio, Encomendada e Solicitada (exclui OS/EX)" hidden>
                        Marcação
                        <select id="fornecedor-filtro-marcacao">
                            <option value="todos">Todos</option>
                            <option value="os">OS</option>
                            <option value="ex">EX</option>
                            <option value="os-ou-ex">OS ou EX</option>
                            <option value="disponivel" selected>Disponivel</option>
                        </select>
                    </label>
                    <div class="fornecedor-filtros-marcacao-bloco" aria-label="Filtros de marcacao por fornecedor">
                        <div id="fornecedor-filtros-marcacao" class="fornecedor-filtros-marcacao"></div>
                        <button type="button" id="btn-adicionar-filtro-marcacao" class="fornecedor-btn-filtro-marcacao" title="Adicionar linha de filtro">+</button>
                    </div>
                    <label class="fornecedor-controle-filtro-compacto" for="fornecedor-filtro-top" title="Filtro Top">
                        Top
                        <select id="fornecedor-filtro-top">
                            <option value="todos">Todos</option>
                            <option value="sim">Sim</option>
                            <option value="nao">Não</option>
                        </select>
                    </label>
                    <label class="fornecedor-controle-filtro-compacto" for="fornecedor-filtro-arquivado" title="Arquivado">
                        Arquivado
                        <select id="fornecedor-filtro-arquivado">
                            <option value="todos">Todos</option>
                            <option value="sim">Sim</option>
                            <option value="nao" selected>Não</option>
                        </select>
                    </label>
                    <label class="fornecedor-controle-filtro-compacto" for="fornecedor-filtro-descontinuado" title="Descontinuado">
                        Descontinuado
                        <select id="fornecedor-filtro-descontinuado">
                            <option value="todos">Todos</option>
                            <option value="sim">Sim</option>
                            <option value="nao" selected>Não</option>
                        </select>
                    </label>
                </div>
                <div id="fornecedor-filtros-marcacao-extra" class="fornecedor-filtros-marcacao-extra"></div>
                <div class="fornecedor-tabela-encomenda-bloco">
                    <div id="fornecedor-resumo-encomenda" class="fornecedor-resumo-encomenda" aria-live="polite">
                        <div class="fornecedor-resumo-encomenda-centro">
                            <label class="fornecedor-resumo-pesquisa" for="fornecedor-pesquisa">
                                <input id="fornecedor-pesquisa" class="fornecedor-pesquisa-compacta" type="search" placeholder="Nome, Ref., SKU ou tema" autocomplete="off" aria-label="Pesquisa">
                            </label>
                            <span id="fornecedor-resumo-encomenda-texto" class="fornecedor-resumo-encomenda-texto"></span>
                            <span id="fornecedor-total-figuras-encomenda" class="fornecedor-total-figuras-encomenda" aria-live="polite"></span>
                            <div class="fornecedores-acoes fornecedor-acoes-encomenda fornecedor-acoes-encomenda-resumo">
                                <button type="button" id="btn-limpar-fornecedor" class="wallapop-botao" title="Limpar lista">× Limpar</button>
                                <button type="button" id="btn-juntar-selecao-fornecedor" class="wallapop-botao" title="Juntar seleção a encomenda existente" disabled>+ Juntar</button>
                                <button type="button" id="btn-criar-fornecedor" class="wallapop-botao" title="Criar encomenda">+ Criar</button>
                            </div>
                        </div>
                    </div>
                    <div id="fornecedor-resultados" class="fornecedor-resultados"></div>
                </div>
            </section>

            <div class="fornecedores-coluna-direita">
            <section class="fornecedores-painel fornecedores-painel-lista" aria-label="Encomendas a fornecedores">
                <div class="fornecedores-cabecalho-lista">
                    <div class="fornecedores-cabecalho-titulo-filtro">
                        <h2 id="fornecedores-encomendas">Encomendas a fornecedores</h2>
                        <select id="fornecedor-filtro-estado" class="fornecedor-filtro-estado-select" aria-label="Filtrar encomendas por estado">
                            <option value="todos">Todos</option>
                            <option value="a_preparar">A preparar</option>
                            <option value="encomendada" selected>Encomendada</option>
                            <option value="recebida_parcialmente">Recebida parcialmente</option>
                            <option value="recebida">Recebida</option>
                            <option value="cancelada">Cancelada</option>
                        </select>
                    </div>
                </div>
                <div id="fornecedor-pedidos" class="fornecedor-pedidos admin-encomendas-lista"></div>
            </section>
            </div>

        </section>
        <p class="fornecedores-status" id="fornecedores-status" role="status"></p>
    </main>

    <div id="fornecedor-ficha-modal" class="fornecedor-edicao-modal" hidden role="dialog" aria-modal="true" aria-labelledby="fornecedor-ficha-modal-titulo">
        <div class="fornecedor-edicao-dialog fornecedor-ficha-dialog">
            <div class="fornecedor-edicao-topo">
                <h3 id="fornecedor-ficha-modal-titulo">Ficha do fornecedor</h3>
                <button type="button" id="fornecedor-ficha-modal-fechar" class="fornecedor-edicao-fechar" aria-label="Fechar ficha do fornecedor">x</button>
            </div>
            <form class="fornecedor-ficha-form" id="fornecedor-ficha-form">
                <input type="hidden" id="fornecedor-ficha-id">
                <label for="fornecedor-ficha-lista">
                    Fornecedor guardado
                    <select id="fornecedor-ficha-lista"></select>
                </label>
                <label for="fornecedor-ficha-nome">
                    Nome
                    <input id="fornecedor-ficha-nome" type="text" required placeholder="Ex.: Lote 50">
                </label>
                <label for="fornecedor-ficha-contacto">
                    Contacto / link
                    <input id="fornecedor-ficha-contacto" type="text" placeholder="Email, WhatsApp, AliExpress, site...">
                </label>
                <label for="fornecedor-ficha-notas" class="fornecedor-ficha-largo">
                    Notas
                    <textarea id="fornecedor-ficha-notas" rows="3" placeholder="Notas internas, prazos, moedas, regras, observacoes..."></textarea>
                </label>
                <label class="fornecedor-ficha-ativo">
                    <input id="fornecedor-ficha-ativo" type="checkbox" checked>
                    Ativo
                </label>
                <div class="fornecedores-acoes fornecedor-ficha-acoes">
                    <button type="button" id="fornecedor-ficha-apagar" class="wallapop-botao fornecedor-ficha-apagar">Apagar fornecedor</button>
                    <button type="button" id="fornecedor-ficha-novo" class="wallapop-botao">Novo</button>
                    <button type="submit" class="wallapop-botao wallapop-botao-destaque">Guardar fornecedor</button>
                </div>
            </form>
        </div>
    </div>

    <div id="admin-imagem-modal" class="admin-imagem-modal" hidden>
        <button type="button" id="admin-imagem-modal-fechar" class="admin-imagem-modal-fechar" aria-label="Fechar imagem">x</button>
        <img id="admin-imagem-modal-foto" src="" alt="">
    </div>
