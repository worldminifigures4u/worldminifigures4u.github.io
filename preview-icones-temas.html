  }

    display: flex;
    align-items: center;
    gap: 24px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 22px;
    max-width: 560px;
    flex-wrap: wrap;
  }
  .destaque-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .destaque-col img {
    width: 72px;
    height: 72px;
    object-fit: contain;
  }
  .destaque-col .preview-icon {
    width: 72px;
    height: 72px;
    background: currentColor;
    color: #ffc107;
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
  }
  .destaque-col strong {
    display: block;
    font-size: 13px;
    font-weight: 800;
  }
  .destaque-col span {
    color: #aaa;
    font-size: 12px;
  }
  .grelha {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 12px 14px;
    min-height: 52px;
  }
  .item:hover {
    border-color: rgba(255, 193, 7, 0.55);
    color: #ffc107;
  }
  .icone-caixa {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    display: grid;
    place-items: center;
    background: #1a1a1a;
    border-radius: 8px;
  }
  .icone-tema {
    width: 22px;
    height: 22px;
    display: block;
  }
  .icone-tema-marca { overflow: visible; }
  .nome {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.25;
  }
  .menu-demo {
    margin-top: 32px;
    max-width: 250px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 15px;
  }
  .menu-demo h2 {
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #2a2a2a;
    font-size: 18px;
    font-weight: 800;
  }
  .btn-tema {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 10px 16px;
    margin: 0 0 6px;
    background: transparent;
    color: #fff;
    font: inherit;
    font-weight: 800;
    font-size: 14px;
    text-align: left;
    cursor: default;
  }
  .btn-tema .icone-tema { width: 20px; height: 20px; flex: 0 0 20px; }
  .btn-tema.ativo,
  .btn-tema:hover {
    background: #222;
    color: #ffc107;
    border-color: #ffc107;
  }

function criarSvg(partes, preenchido) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.classList.add('icone-tema');
  if (preenchido) {
    svg.setAttribute('fill', 'currentColor');
    svg.setAttribute('stroke', 'none');
    svg.classList.add('icone-tema-marca');
  } else {
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
  }
  partes.forEach((parte) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', parte.tag);
    Object.entries(parte.attrs).forEach(([k, v]) => el.setAttribute(k, v));
    svg.appendChild(el);
  });
  return svg;
}

const grelha = document.getElementById('grelha');
const menu = document.getElementById('menu-demo');
const destaque = document.getElementById('destaque');
const temas = Object.keys(MAPA);
const MAPA_MASCARAS = {
  'Bluey': 'img/icone-bluey.png',
  'Dinossauros': 'img/icone-dinossauros.png'
};
const DESTAQUE = 'Bluey';

function criarIconePreview(tema, tamanho) {
  const mascara = MAPA_MASCARAS[tema];
  if (mascara) {
    const mask = document.createElement('div');
    const largura = tema === 'DC Comics' ? Math.round(tamanho * 2) : tamanho;
    const altura = tema === 'DC Comics' ? Math.round(tamanho * 1.5) : tamanho;
    mask.className = 'preview-icon';
    mask.style.width = largura + 'px';
    mask.style.height = altura + 'px';
    mask.style.flex = '0 0 ' + largura + 'px';
    mask.style.webkitMaskImage = "url('" + mascara + "')";
    mask.style.maskImage = "url('" + mascara + "')";
    return mask;
  }
  return criarSvg(MAPA[tema], tema === 'DC Comics');
}

(function mostrarDestaque() {
  const mascara = MAPA_MASCARAS[DESTAQUE];
  const origCol = document.createElement('div');
  origCol.className = 'destaque-col';
  const origImg = document.createElement('img');
  origImg.src = mascara;
  origImg.alt = DESTAQUE;
  origImg.style.filter = 'invert(77%) sepia(73%) saturate(747%) hue-rotate(359deg) brightness(103%) contrast(104%)';
  origCol.appendChild(origImg);
  origCol.insertAdjacentHTML('beforeend', '<strong>' + DESTAQUE + '</strong><span>exacto da tua imagem</span>');

  const menuCol = document.createElement('div');
  menuCol.className = 'destaque-col';
  menuCol.appendChild(criarIconePreview(DESTAQUE, 16));
  menuCol.insertAdjacentHTML('beforeend', '<strong>No menu</strong><span>16Ã—16 px</span>');

  destaque.appendChild(origCol);
  destaque.appendChild(menuCol);
})();

temas.forEach((tema, i) => {
  const item = document.createElement('div');
  item.className = 'item';
  const caixa = document.createElement('div');
  caixa.className = 'icone-caixa';
  caixa.appendChild(criarIconePreview(tema, 22));
  const nome = document.createElement('div');
  nome.className = 'nome';
  nome.textContent = tema;
  item.appendChild(caixa);
  item.appendChild(nome);
  grelha.appendChild(item);

  if (i < 8) {
    const btn = document.createElement('div');
    btn.className = 'btn-tema' + (i === 0 ? ' ativo' : '');
    btn.appendChild(criarIconePreview(tema, 16));
    const span = document.createElement('span');
    span.textContent = tema;
    btn.appendChild(span);
    menu.appendChild(btn);
  }
});
