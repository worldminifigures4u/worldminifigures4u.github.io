<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Minifigures 4U</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body{
            margin:0;
            padding:0;
            background:#000;
            color:#fff;
            font-family:Arial, Helvetica, sans-serif;
        }

        header{
            background:#ffc107;
            color:#000;
            text-align:center;
            padding:20px;
        }

        .container{
            display:flex;
            gap:20px;
            padding:20px;
            align-items:flex-start;
        }

        .menu-temas{
            width:250px;
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            height:fit-content;
        }

        .menu-temas h2{
            margin-top:0;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        .produtos{
            flex:1;
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
            gap:20px;
        }

        .produto-card{
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            display:flex;
            flex-direction:column;
            transition:0.2s;
        }

        .produto-card:hover{
            border-color:#ffc107;
        }

        .produto-img{
            width:100%;
            height:220px;
            object-fit:contain;
            background:#222;
            border-radius:10px;
        }

        .produto-miniaturas{
            display:flex;
            justify-content:center;
            gap:6px;
            margin-top:10px;
        }

        .miniatura-img{
            width:45px;
            height:45px;
            object-fit:contain;
            border-radius:6px;
            border:1px solid #444;
            cursor:pointer;
        }

        .categoria{
            margin-top:10px;
            color:#ffc107;
            font-size:12px;
            font-weight:bold;
            text-transform:uppercase;
        }

        .subcategoria{
            color:#aaa;
            font-size:12px;
            margin-top:4px;
        }

        .produto-card h3{
            margin-top:12px;
            margin-bottom:0;
        }

        .preco{
            color:#ff4d4d;
            font-size:24px;
            font-weight:bold;
            margin-top:10px;
        }

        .btn-adicionar{
            margin-top:auto;
            background:#ffc107;
            border:none;
            border-radius:8px;
            padding:12px;
            font-weight:bold;
            cursor:pointer;
            transition:0.2s;
        }

        .btn-adicionar:hover{
            background:#e0a800;
        }

        .btn-tema,
        .btn-subtema{
            width:100%;
            border:none;
            border-radius:6px;
            padding:10px;
            margin-bottom:6px;
            text-align:left;
            cursor:pointer;
            font-weight:bold;
        }

        .btn-tema{
            background:#222;
            color:#fff;
        }

        .btn-subtema{
            background:#181818;
            color:#ccc;
        }

        .btn-tema:hover,
        .btn-subtema:hover,
        .btn-tema.ativo,
        .btn-subtema.ativo{
            background:#ffc107;
            color:#000;
        }

        .grupo-subtemas{
            margin-left:10px;
            padding-left:8px;
            border-left:2px solid #333;
            display:none;
        }

        .estado-vitrine{
            background:#111;
            padding:30px;
            border-radius:12px;
            text-align:center;
            grid-column:1 / -1;
        }

        .erro{
            color:#ff4d4d;
        }

        .carrinho{
            width:320px;
            background:#111;
            border-radius:12px;
            padding:15px;
            border:1px solid #333;
            height:fit-content;
        }

        .carrinho h2{
            margin-top:0;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        .lista-carrinho{
            max-height:300px;
            overflow-y:auto;
        }

        .item-carrinho{
            border-bottom:1px solid #333;
            padding:10px 0;
            display:flex;
            justify-content:space-between;
            gap:10px;
        }

        .item-carrinho strong{
            color:#ffc107;
        }

        .btn-remover{
            background:#ff4d4d;
            border:none;
            color:white;
            padding:6px 10px;
            border-radius:6px;
            cursor:pointer;
            height:fit-content;
        }

        .select-envio{
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid #333;
            background:#222;
            color:white;
            margin-top:10px;
        }

        .total-box{
            margin-top:20px;
            border-top:2px solid #333;
            padding-top:15px;
        }

        .linha-total{
            display:flex;
            justify-content:space-between;
            margin-bottom:10px;
        }

        .valor-final{
            color:#ff4d4d;
            font-size:26px;
            font-weight:bold;
        }

        @media(max-width:1100px){

            .container{
                flex-direction:column;
            }

            .menu-temas,
            .carrinho{
                width:100%;
                box-sizing:border-box;
            }
        }

    </style>
</head>
<body>

<header>
    <h1>🌍 World Minifigures 4U</h1>
    <p>Minifiguras exclusivas de todo o mundo</p>
</header>

<div class="container">

    <aside class="menu-temas" id="menu-lateral-temas">

        <h2>Temas</h2>

        <button class="btn-tema ativo"
        onclick="filtrarTema('todos', this)">
            ⭐ Todos os Temas
        </button>

    </aside>

    <main class="produtos" id="vitrine-produtos">

        <div class="estado-vitrine">
            A carregar minifiguras extraordinárias...
        </div>

    </main>

    <aside class="carrinho">

        <h2>🛒 Carrinho</h2>

        <div class="lista-carrinho" id="lista-carrinho">

            <p id="carrinho-vazio">
                Nenhum produto adicionado.
            </p>

        </div>

        <label>📦 Região de envio:</label>

        <select class="select-envio"
        id="regiao-envio"
        onchange="recalcularTotais()">

            <option value="portugal">
                Portugal
            </option>

            <option value="europa">
                Europa
            </option>

            <option value="resto">
                Resto do Mundo
            </option>

        </select>

        <div class="total-box">

            <div class="linha-total">
                <span>Subtotal:</span>
                <span id="subtotal">0,00 €</span>
            </div>

            <div class="linha-total">
                <span>Portes:</span>
                <span id="portes">0,00 €</span>
            </div>

            <div class="linha-total valor-final">
                <span>Total:</span>
                <span id="total">0,00 €</span>
            </div>

        </div>

    </aside>

</div>

<script>

const SUPABASE_URL = "https://gksndzxadndrsynvzgzb.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdrc25kenhhZG5kcnN5bnZ6Z3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODc5NzMsImV4cCI6MjA5NDY2Mzk3M30.EHZgacYr27dqoc4CJHsOwkNnJFGlLIteSHBi4B1HfVE";

let dbClient = null;

let todosOsProdutos = [];

let carrinho = [];

window.addEventListener('load', async () => {

    if(typeof supabase !== 'undefined'){

        dbClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        carregarProdutosDaNuvem();
    }
});

function formatarEuro(valor){

    return Number(valor || 0)
        .toFixed(2)
        .replace('.', ',');
}

function definirEstadoVitrine(mensagem, tipo = ''){

    document.getElementById('vitrine-produtos').innerHTML = `
        <div class="estado-vitrine ${tipo}">
            ${mensagem}
        </div>
    `;
}

function executarComTimeout(promessa, ms, mensagemErro){

    let timeout;

    const timeoutPromise = new Promise((_, reject) => {

        timeout = setTimeout(() => {

            reject(new Error(mensagemErro));

        }, ms);
    });

    return Promise.race([
        promessa,
        timeoutPromise
    ]).finally(() => clearTimeout(timeout));
}

async function carregarProdutosDaNuvem(){

    definirEstadoVitrine(
        'A carregar minifiguras extraordinárias...'
    );

    try{

        const query = dbClient
            .from('produtos')
            .select('*')
            .order('tema', { ascending:true })
            .order('subtema', { ascending:true })
            .order('nome', { ascending:true });

        const {
            data: listaProdutos,
            error
        } = await executarComTimeout(
            query,
            15000,
            'Consulta demasiado lenta.'
        );

        if(error){
            console.error(error);
            throw error;
        }

        if(!listaProdutos || listaProdutos.length === 0){

            definirEstadoVitrine(
                'Nenhum produto encontrado.',
                'erro'
            );

            return;
        }

        todosOsProdutos = listaProdutos;

        gerarMenus(listaProdutos);

        gerarProdutos(listaProdutos);

    }catch(erro){

        console.error(erro);

        definirEstadoVitrine(
            'Erro ao carregar produtos do Supabase.',
            'erro'
        );
    }
}

function gerarMenus(listaProdutos){

    const menu = document.getElementById(
        'menu-lateral-temas'
    );

    menu.innerHTML = `
        <h2>Temas</h2>

        <button class="btn-tema ativo"
        onclick="filtrarTema('todos', this)">
            ⭐ Todos os Temas
        </button>
    `;

    const mapa = {};

    listaProdutos.forEach(prod => {

        const tema = (
            prod.tema || 'Outros'
        ).trim();

        const subtema = (
            prod.subtema &&
            prod.subtema !== 'semsubtema'
        ) ? prod.subtema.trim() : '';

        if(!mapa[tema]){
            mapa[tema] = [];
        }

        if(subtema &&
        !mapa[tema].includes(subtema)){

            mapa[tema].push(subtema);
        }
    });

    Object.keys(mapa).forEach(tema => {

        const temaId = tema
            .toLowerCase()
            .replace(/\s+/g, '-');

        const btnTema = document.createElement('button');

        btnTema.className = 'btn-tema';

        btnTema.innerText = tema;

        btnTema.onclick = function(){

            filtrarTema(temaId, this);
        };

        menu.appendChild(btnTema);

        if(mapa[tema].length > 0){

            const grupo = document.createElement('div');

            grupo.className = 'grupo-subtemas';

            grupo.id = 'grupo-' + temaId;

            mapa[tema].forEach(subtema => {

                const subId = subtema
                    .toLowerCase()
                    .replace(/\s+/g, '-');

                const btnSub = document.createElement('button');

                btnSub.className = 'btn-subtema';

                btnSub.innerText = '• ' + subtema;

                btnSub.onclick = function(e){

                    e.stopPropagation();

                    filtrarTema(
                        temaId + '|' + subId,
                        this
                    );
                };

                grupo.appendChild(btnSub);
            });

            menu.appendChild(grupo);
        }
    });
}

function gerarProdutos(listaProdutos){

    const vitrine = document.getElementById(
        'vitrine-produtos'
    );

    vitrine.innerHTML = '';

    listaProdutos.forEach(prod => {

        const card = document.createElement('div');

        card.className = 'produto-card';

        const temaId = (
            prod.tema || ''
        ).toLowerCase().replace(/\s+/g, '-');

        const subtemaId = (
            prod.subtema || ''
        ).toLowerCase().replace(/\s+/g, '-');

        card.dataset.tema = temaId;

        card.dataset.subtema = subtemaId;

        let imagens = [];

        if(Array.isArray(prod.imagens)){

            imagens = prod.imagens;

        }else if(prod.imagens){

            imagens = [prod.imagens];
        }

        if(Array.isArray(prod.miniaturas)){

            imagens = [
                ...imagens,
                ...prod.miniaturas
            ];
        }

        const imagemPrincipal = document.createElement('img');

        imagemPrincipal.className = 'produto-img';

        imagemPrincipal.src =
            imagens.length > 0
            ? imagens[0]
            : 'https://placehold.co/300x300?text=Sem+Imagem';

        card.appendChild(imagemPrincipal);

        if(imagens.length > 1){

            const miniaturasDiv =
                document.createElement('div');

            miniaturasDiv.className =
                'produto-miniaturas';

            imagens.forEach(url => {

                const mini =
                    document.createElement('img');

                mini.className = 'miniatura-img';

                mini.src = url;

                mini.onclick = function(){

                    imagemPrincipal.src = url;
                };

                miniaturasDiv.appendChild(mini);
            });

            card.appendChild(miniaturasDiv);
        }

        const categoria =
            document.createElement('div');

        categoria.className = 'categoria';

        categoria.innerText =
            prod.tema || 'Outros';

        card.appendChild(categoria);

        if(prod.subtema &&
        prod.subtema !== 'semsubtema'){

            const subcategoria =
                document.createElement('div');

            subcategoria.className =
                'subcategoria';

            subcategoria.innerText =
                prod.subtema;

            card.appendChild(subcategoria);
        }

        const titulo =
            document.createElement('h3');

        titulo.innerText =
            prod.nome || '';

        card.appendChild(titulo);

        const preco =
            document.createElement('div');

        preco.className = 'preco';

        preco.innerText =
            formatarEuro(prod.preco) + ' €';

        card.appendChild(preco);

        const btn =
            document.createElement('button');

        btn.className = 'btn-adicionar';

        btn.innerText =
            'Adicionar ao Carrinho';

        btn.onclick = function(){

            adicionarAoCarrinho(prod);
        };

        card.appendChild(btn);

        vitrine.appendChild(card);
    });
}

function filtrarTema(filtro, botao){

    document
        .querySelectorAll('.btn-tema, .btn-subtema')
        .forEach(btn => {

            btn.classList.remove('ativo');
        });

    botao.classList.add('ativo');

    const produtos =
        document.querySelectorAll('.produto-card');

    if(filtro === 'todos'){

        produtos.forEach(prod => {

            prod.style.display = 'flex';
        });

        document
            .querySelectorAll('.grupo-subtemas')
            .forEach(g => {

                g.style.display = 'none';
            });

        return;
    }

    const partes = filtro.split('|');

    const tema = partes[0];

    const subtema = partes[1] || null;

    produtos.forEach(prod => {

        const temaProd = prod.dataset.tema;

        const subProd = prod.dataset.subtema;

        const mostrar = subtema
            ? (temaProd === tema &&
               subProd === subtema)
            : (temaProd === tema);

        prod.style.display =
            mostrar ? 'flex' : 'none';
    });

    document
        .querySelectorAll('.grupo-subtemas')
        .forEach(g => {

            if(g.id !== 'grupo-' + tema){

                g.style.display = 'none';
            }
        });

    const grupoAlvo =
        document.getElementById(
            'grupo-' + tema
        );

    if(grupoAlvo && !subtema){

        grupoAlvo.style.display = 'block';
    }
}

function adicionarAoCarrinho(prod){

    carrinho.push(prod);

    atualizarCarrinho();
}

function atualizarCarrinho(){

    const lista =
        document.getElementById(
            'lista-carrinho'
        );

    if(carrinho.length === 0){

        lista.innerHTML = `
            <p id="carrinho-vazio">
                Nenhum produto adicionado.
            </p>
        `;

        recalcularTotais();

        return;
    }

    lista.innerHTML = '';

    carrinho.forEach((item, index) => {

        const div =
            document.createElement('div');

        div.className = 'item-carrinho';

        div.innerHTML = `
            <div>
                <strong>${item.nome}</strong><br>
                ${formatarEuro(item.preco)} €
            </div>

            <button
            class="btn-remover"
            onclick="removerCarrinho(${index})">
                X
            </button>
        `;

        lista.appendChild(div);
    });

    recalcularTotais();
}

function removerCarrinho(index){

    carrinho.splice(index, 1);

    atualizarCarrinho();
}

function recalcularTotais(){

    let subtotal = 0;

    carrinho.forEach(item => {

        subtotal += Number(item.preco || 0);
    });

    let portes = 0;

    const regiao =
        document.getElementById(
            'regiao-envio'
        ).value;

    if(carrinho.length > 0){

        if(regiao === 'portugal'){

            portes = 4.95;
        }

        if(regiao === 'europa'){

            portes = 9.95;
        }

        if(regiao === 'resto'){

            portes = 14.95;
        }
    }

    const total = subtotal + portes;

    document.getElementById('subtotal')
        .innerText =
        formatarEuro(subtotal) + ' €';

    document.getElementById('portes')
        .innerText =
        formatarEuro(portes) + ' €';

    document.getElementById('total')
        .innerText =
        formatarEuro(total) + ' €';
}

</script>

</body>
</html>
