<!DOCTYPE html>
<html lang="pt">
<head>

    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Encomendas | Figures Planet</title>
    <link rel="icon" type="image/png" href="figures-planet-logo-transparent.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
    <link rel="stylesheet" href="styles.css?v=20260701-admin-plataformas">
    <link rel="stylesheet" href="admin-cliente.css?v=20260628-css-split-admin-cliente">
    <link rel="stylesheet" href="admin-imagem.css?v=20260628-css-split-admin-imagem">
    <link rel="stylesheet" href="encomendas.css?v=20260628-css-split-encomendas">
</head>
<body class="pagina-encomendas-admin cabecalho-com-admin pagina-com-cabecalho-site">
    <header class="cabecalho-site-admin">
        <div class="cabecalho-loja">
            <a class="logo-loja" href="index.html" aria-label="Figures Planet - Produtos">
                <img src="figures-planet-logo-transparent.png" alt="Figures Planet">
            </a>
            <form class="cabecalho-pesquisa" action="index.html" method="get">
                <input type="search" name="q" class="input-pesquisa" placeholder="O que estás à procura?">
                <span class="icone-pesquisa" aria-hidden="true"></span>
            </form>
            <div class="acoes-cabecalho acoes-cabecalho-publicas">
                <a class="acao-cabecalho" href="conta.html" aria-label="Abrir area de cliente" data-vista-nav="conta">
                    <span class="icone-acao" aria-hidden="true"></span>
                    <span class="texto-acao">
                        <strong>Conta</strong>
                        <span class="detalhe-conta-cabecalho" id="nome-login-cabecalho"></span>
                    </span>
                </a>
                <a class="acao-cabecalho acao-carrinho" href="carrinho.html" aria-label="Abrir carrinho" data-vista-nav="carrinho">
                    <span class="icone-acao" aria-hidden="true"></span>
                    <span class="badge-carrinho" id="contador-carrinho-cabecalho">0</span>
                </a>
            </div>
            <nav class="navegacao-publica-cabecalho" aria-label="Navegacao principal">
                <a class="acao-cabecalho acao-produtos" href="index.html" data-vista-nav="loja">
                    <span class="texto-acao"><strong>Produtos</strong></span>
                </a>
                <a class="acao-cabecalho acao-favoritos" href="favoritos.html" data-vista-nav="favoritos">
                    <span class="texto-acao"><strong>Favoritos</strong></span>
                </a>
                <a class="acao-cabecalho" href="sobre.html" data-vista-nav="sobre">
                    <span class="texto-acao"><strong>Sobre n&oacute;s</strong></span>
                </a>
                <a class="acao-cabecalho" href="contactos.html" data-vista-nav="contactos">
                    <span class="texto-acao"><strong>Contactos</strong></span>
                </a>
                <a class="acao-cabecalho" href="politicas.html" data-vista-nav="politicas">
                    <span class="texto-acao"><strong>Pol&iacute;ticas</strong></span>
                </a>
            </nav>
            <nav class="navegacao-admin-cabecalho" aria-label="Navegação administrativa" hidden>
            <a class="acao-cabecalho acao-gestao-admin" href="gestao.html" aria-label="Abrir gestão administrativa">
                <span class="texto-acao"><strong>Gestão</strong></span>
            </a>
            <a class="acao-cabecalho acao-plataforma-admin" href="plataforma.html" aria-label="Gerir plataformas"><span class="texto-acao"><strong>Plataformas</strong></span></a>
            <a class="acao-cabecalho" href="mapas.html">Mapas</a>
            <a class="acao-cabecalho" href="fornecedores.html">Fornecedores</a>
            <a class="acao-cabecalho ativa" href="encomendas.html">Encomendas</a>
            <a class="acao-cabecalho" href="estatisticas.html">Estatísticas</a>
            <a class="acao-cabecalho" href="clientes.html">Clientes</a>
            </nav>
        </div>
    </header>

    <div class="wallapop-bloqueio" id="encomendas-bloqueio">A verificar acesso administrativo...</div>

    <main class="admin-encomendas" id="encomendas-aplicacao" hidden>
        <section class="admin-encomendas-resumo" aria-label="Resumo das encomendas">
            <div><strong id="encomendas-total">0</strong><span>Total</span></div>
            <div><strong id="encomendas-pendentes">0</strong><span>A aguardar pagamento</span></div>
            <div><strong id="encomendas-preparacao">0</strong><span>Em preparação</span></div>
            <div><strong id="encomendas-enviadas">0</strong><span>Enviadas</span></div>
        </section>

        <section class="admin-encomendas-filtros" aria-label="Pesquisa e filtros">
            <label>
                <span>Pesquisar</span>
                <input type="search" id="pesquisa-encomendas-admin" placeholder="Código, nome ou e-mail" autocomplete="off">
            </label>
            <label>
                <span>Estado</span>
                <select id="filtro-estado-encomendas-admin">
                    <option value="todos">Todos os estados</option>
                    <option value="A aguardar pagamento" selected>A aguardar pagamento</option>
                    <option value="Pago">Pago</option>
                    <option value="Em preparação">Em preparação</option>
                    <option value="Enviado">Enviado</option>
                    <option value="Concluído">Concluído</option>
                    <option value="Cancelado">Cancelado</option>
                </select>
            </label>
            <button type="button" class="wallapop-botao" id="btn-atualizar-encomendas">Atualizar</button>
        </section>

        <p class="admin-encomendas-contagem" id="contagem-encomendas-admin" aria-live="polite"></p>
        <section class="admin-encomendas-lista" id="lista-encomendas-admin"></section>
        <p class="wallapop-status" id="status-encomendas-admin" aria-live="polite"></p>
    </main>

    <div class="admin-imagem-modal" id="admin-imagem-modal" hidden role="dialog" aria-modal="true" aria-label="Fotografia do produto">
        <button type="button" class="admin-imagem-modal-fechar" id="admin-imagem-modal-fechar" aria-label="Fechar fotografia">&times;</button>
        <img id="admin-imagem-modal-foto" alt="">
    </div>

    <div class="admin-cliente-modal" id="admin-cliente-modal" hidden role="dialog" aria-modal="true" aria-labelledby="admin-cliente-titulo">
        <div class="admin-cliente-dialogo">
            <button type="button" class="admin-cliente-fechar" id="admin-cliente-fechar" aria-label="Fechar ficha do cliente">&times;</button>
            <h2 id="admin-cliente-titulo">Ficha de cliente</h2>
            <div id="admin-cliente-conteudo"></div>
            <p class="wallapop-status" id="admin-cliente-status" aria-live="polite"></p>
        </div>
    </div>
    <script src="encomendas.js?v=20260627-filtro-aguardar-pagamento"></script>
<script src="inline-listeners.js?v=20260629-csp-inline"></script>
</body>
</html>
