<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com; connect-src 'self' https://cdn.jsdelivr.net https://gksndzxadndrsynvzgzb.supabase.co wss://gksndzxadndrsynvzgzb.supabase.co https://api.cloudinary.com; img-src 'self' data: blob: https://res.cloudinary.com https://gksndzxadndrsynvzgzb.supabase.co; style-src 'self'; font-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Clientes | Figures Planet</title>
    <link rel="icon" type="image/png" href="figures-planet-logo-transparent.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
    <link rel="stylesheet" href="styles.css?v=20260702-rodape-leve">
    <link rel="stylesheet" href="admin-cliente.css?v=20260628-css-split-admin-cliente">
    <link rel="stylesheet" href="clientes.css?v=20260703-campos-compactos">
</head>
<body class="pagina-clientes-admin cabecalho-com-admin pagina-com-cabecalho-site">
    <header class="cabecalho-site-admin">
        <div class="cabecalho-loja">
            <a class="logo-loja" href="index.html" aria-label="Figures Planet - Produtos">
                <img src="figures-planet-logo-transparent.png" alt="Figures Planet">
            </a>
            <form class="cabecalho-pesquisa" action="index.html" method="get">
                <input type="search" name="q" class="input-pesquisa" placeholder="O que estás à procura?">
                <span class="icone-pesquisa" aria-hidden="true"></span>
            </form>
            <div class="acoes-cabecalho acoes-cabecalho-publicas">
                <a class="acao-cabecalho" href="conta.html" aria-label="Abrir area de cliente" data-vista-nav="conta">
                    <span class="icone-acao" aria-hidden="true"></span>
                    <span class="texto-acao">
                        <strong>Conta</strong>
                        <span class="detalhe-conta-cabecalho" id="nome-login-cabecalho"></span>
                    </span>
                </a>
                <a class="acao-cabecalho acao-favoritos-topo" href="favoritos.html" aria-label="Abrir favoritos" title="Favoritos" data-vista-nav="favoritos">
                    <svg class="icone-coracao-favorito" viewBox="0 0 100 92" aria-hidden="true" focusable="false">
                        <path d="M50 84 L14 48 C3 37 3 18 15 9 C27 0 44 4 50 20 C56 4 73 0 85 9 C97 18 97 37 86 48 Z" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </a>
                <a class="acao-cabecalho acao-carrinho" href="carrinho.html" aria-label="Abrir carrinho" data-vista-nav="carrinho">
                    <span class="icone-acao" aria-hidden="true"></span>
                    <span class="badge-carrinho" id="contador-carrinho-cabecalho">0</span>
                </a>
            </div>
            <nav class="navegacao-admin-cabecalho" aria-label="Navegação administrativa" hidden>
            <a class="acao-cabecalho acao-gestao-admin" href="gestao.html" aria-label="Abrir gestão administrativa">
                <span class="texto-acao"><strong>Gestão</strong></span>
            </a>
            <a class="acao-cabecalho acao-plataforma-admin" href="plataforma.html" aria-label="Gerir plataformas"><span class="texto-acao"><strong>Plataformas</strong></span></a>
            <a class="acao-cabecalho" href="mapas.html">Mapas</a>
            <a class="acao-cabecalho" href="fornecedores.html">Fornecedores</a>
            <a class="acao-cabecalho" href="encomendas.html">Encomendas</a>
            <a class="acao-cabecalho" href="estatisticas.html">Estatísticas</a>
            <a class="acao-cabecalho ativa" href="clientes.html">Clientes</a>
            </nav>
        </div>
    </header>

    <div class="wallapop-bloqueio" id="clientes-bloqueio">A verificar acesso administrativo...</div>

    <main class="clientes-admin" id="clientes-aplicacao" hidden>
        <section class="clientes-pesquisa" aria-label="Pesquisa de clientes">
            <input type="search" id="clientes-pesquisa" placeholder="Pesquisar por nome, telefone, cidade, notas ou link externo" autocomplete="off">
            <button type="button" class="wallapop-botao wallapop-botao-destaque" id="btn-pesquisar-clientes">Pesquisar</button>
            <button type="button" class="wallapop-botao" id="btn-criar-cliente">Criar cliente</button>
        </section>
        <section class="clientes-layout">
            <div class="clientes-lista" id="clientes-lista"></div>
            <article class="clientes-ficha" id="clientes-ficha">
                <p class="admin-cliente-vazio">Escolha um cliente para abrir a ficha.</p>
            </article>
        </section>
        <p class="wallapop-status" id="clientes-status" aria-live="polite"></p>
    </main>
    <script src="clientes.js?v=20260703-campos-compactos"></script>
<script src="inline-listeners.js?v=20260629-csp-inline"></script>
</body>
</html>
